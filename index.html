"कुंजी हट जाए", "तालिका हमेशा भरी हो"], 0, "एक bucket में अलग कुंजियों को संभालना जरूरी है।"]], "zh": [["对于 [10,20,30,40]，numbers[2] 是多少？", ["20", "30", "40"], 1, "索引从 0 开始，因此索引 2 的值是 30。"], ["单向链表的节点保存什么？", ["只有索引", "一个值和指向下一个节点的引用", "所有其他节点"], 1, "next 引用连接到下一个节点。"], ["Push 10、Push 20、Pop，返回什么？", ["10", "20", "两个值"], 1, "栈遵循 LIFO，20 是最后加入的。"], ["Enqueue 10、Enqueue 20、Dequeue，返回什么？", ["10", "20", "没有值"], 0, "队列遵循 FIFO，10 最先到达。"], ["关于有根树，哪项正确？", ["每个节点都有两个子节点", "必须包含环", "除根外，每个节点都有一个父节点"], 2, "树是没有环的层级结构。"], ["BFS 在无权图中找到什么？", ["边数最少的路径", "总是公里数最少的路径", "只有根的子节点"], 0, "BFS 逐层探索图。"], ["什么是哈希冲突？", ["两个键进入同一个桶", "删除了一个键", "表总是满的"], 0, "实现必须处理同一个桶中的不同键。"]]}, "c": {"da": ["#include <stdio.h>\n\nint main(void) {\n    int numbers[8] = {10, 20, 30, 40};\n    size_t count = 4;\n    const size_t capacity = sizeof numbers / sizeof numbers[0];\n    printf(\"%d\\n\", numbers[2]);  // 30\n\n    // Gør plads forrest; kontrollér kapaciteten først.\n    if (count == capacity) return 1;\n    for (size_t i = count; i > 0; --i)\n        numbers[i] = numbers[i - 1];\n    numbers[0] = 5;\n    ++count;\n    for (size_t i = 0; i < count; ++i)\n        printf(\"%d%s\", numbers[i], i + 1 == count ? \"\\n\" : \" \");\n    return 0;\n}", "#include <stdio.h>\n\ntypedef struct Node {\n    int value;\n    struct Node *next;\n} Node;\n\nint main(void) {\n    // Lokale noder eksisterer, indtil main returnerer.\n    Node third = {30, NULL};\n    Node second = {20, &third};\n    Node first = {10, &second};\n    Node fourth = {40, NULL};\n    third.next = &fourth;  // Tilføj efter en kendt node.\n\n    for (const Node *node = &first; node != NULL; node = node->next)\n        printf(\"%d\\n\", node->value);\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define CAPACITY 8\n\ntypedef struct {\n    int values[CAPACITY];\n    size_t count;\n} Stack;\n\nbool push(Stack *s, int value) {\n    if (s->count == CAPACITY) return false;\n    s->values[s->count++] = value;\n    return true;\n}\n\nbool pop(Stack *s, int *out) {\n    if (s->count == 0) return false;\n    *out = s->values[--s->count];\n    return true;\n}\n\nint main(void) {\n    Stack s = {{10, 20, 30}, 3};\n    int value;\n    if (!push(&s, 40) || !push(&s, 50)) return 1;\n    if (pop(&s, &value)) printf(\"%d\\n\", value);  // 50\n    if (pop(&s, &value)) printf(\"%d\\n\", value);  // 40\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define CAPACITY 8\n\ntypedef struct {\n    int values[CAPACITY];\n    size_t front, count;\n} Queue;\n\nbool enqueue(Queue *q, int value) {\n    if (q->count == CAPACITY) return false;\n    // Gå tilbage til starten uden at flytte de eksisterende elementer.\n    size_t back = (q->front + q->count) % CAPACITY;\n    q->values[back] = value;\n    ++q->count;\n    return true;\n}\n\nbool dequeue(Queue *q, int *out) {\n    if (q->count == 0) return false;\n    *out = q->values[q->front];\n    q->front = (q->front + 1) % CAPACITY;\n    --q->count;\n    return true;\n}\n\nint main(void) {\n    Queue q = {{0}, 0, 0};\n    for (int value = 10; value <= 40; value += 10)\n        if (!enqueue(&q, value)) return 1;\n    int value;\n    while (dequeue(&q, &value)) printf(\"%d\\n\", value);\n    return 0;\n}", "#include <stddef.h>\n#include <stdio.h>\n\ntypedef struct Node {\n    const char *name;\n    const struct Node *children[2];\n    size_t child_count;\n} Node;\n\nvoid visit(const Node *node) {\n    if (node == NULL) return;\n    puts(node->name);  // Preorder: forælder før børn.\n    for (size_t i = 0; i < node->child_count; ++i)\n        visit(node->children[i]);\n}\n\nint main(void) {\n    const Node intro = {\"intro.py\", {NULL, NULL}, 0};\n    const Node agent = {\"agent.py\", {NULL, NULL}, 0};\n    const Node sensor = {\"sensor.py\", {NULL, NULL}, 0};\n    const Node python = {\"Python\", {&intro, &agent}, 2};\n    const Node robot = {\"Robot\", {&sensor, NULL}, 1};\n    const Node root = {\"Kursus\", {&python, &robot}, 2};\n    visit(&root);\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define V 5\n\nint main(void) {\n    // A=0, B=1, C=2, D=3, E=4. -1 markerer en ubrugt plads.\n    const int graph[V][3] = {\n        {1, 2, -1}, {0, 3, -1}, {0, 3, 4},\n        {1, 2, 4}, {2, 3, -1}\n    };\n    int queue[V], front = 0, back = 0;\n    bool seen[V] = {false};\n    seen[0] = true;\n    queue[back++] = 0;\n\n    while (front < back) {\n        int node = queue[front++];\n        printf(\"%c\\n\", 'A' + node);\n        for (int i = 0; i < 3 && graph[node][i] != -1; ++i) {\n            int neighbor = graph[node][i];\n            if (!seen[neighbor]) {\n                // Markér ved enqueue: hver node kommer kun i køen én gang.\n                seen[neighbor] = true;\n                queue[back++] = neighbor;\n            }\n        }\n    }\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#include <string.h>\n#define BUCKETS 5\n#define MAX_ENTRIES 10\n\ntypedef struct Entry {\n    const char *key;\n    int value;\n    struct Entry *next;\n} Entry;\n\ntypedef struct {\n    Entry *buckets[BUCKETS];\n    Entry entries[MAX_ENTRIES];\n    size_t used;\n} Table;\n\nunsigned hash(const char *key) {\n    unsigned result = 0;\n    while (*key != '\\0')\n        result = (result + (unsigned char)*key++) % BUCKETS;\n    return result;\n}\n\nEntry *find(Table *t, const char *key) {\n    for (Entry *e = t->buckets[hash(key)]; e != NULL; e = e->next)\n        if (strcmp(e->key, key) == 0) return e;\n    return NULL;\n}\n\nbool put(Table *t, const char *key, int value) {\n    Entry *existing = find(t, key);\n    if (existing != NULL) {\n        existing->value = value;\n        return true;\n    }\n    if (t->used == MAX_ENTRIES) return false;\n    unsigned bucket = hash(key);\n    Entry *e = &t->entries[t->used++];\n    // Nøgler skal leve længere end tabellen; her bruges strengliteraler.\n    *e = (Entry){key, value, t->buckets[bucket]};\n    t->buckets[bucket] = e;\n    return true;\n}\n\nint main(void) {\n    Table table = {0};\n    if (!put(&table, \"Bo\", 24) || !put(&table, \"Ada\", 25)) return 1;\n    printf(\"Bo: %u, Ada: %u\\n\", hash(\"Bo\"), hash(\"Ada\"));\n    // Begge nøgler har bucket 2 og bevares i kæden.\n    for (Entry *e = table.buckets[2]; e != NULL; e = e->next)\n        printf(\"%s: %d\\n\", e->key, e->value);\n    return 0;\n}"], "en": ["#include <stdio.h>\n\nint main(void) {\n    int numbers[8] = {10, 20, 30, 40};\n    size_t count = 4;\n    const size_t capacity = sizeof numbers / sizeof numbers[0];\n    printf(\"%d\\n\", numbers[2]);  // 30\n\n    // Make room at the front; check capacity first.\n    if (count == capacity) return 1;\n    for (size_t i = count; i > 0; --i)\n        numbers[i] = numbers[i - 1];\n    numbers[0] = 5;\n    ++count;\n    for (size_t i = 0; i < count; ++i)\n        printf(\"%d%s\", numbers[i], i + 1 == count ? \"\\n\" : \" \");\n    return 0;\n}", "#include <stdio.h>\n\ntypedef struct Node {\n    int value;\n    struct Node *next;\n} Node;\n\nint main(void) {\n    // Local nodes stay alive until main returns.\n    Node third = {30, NULL};\n    Node second = {20, &third};\n    Node first = {10, &second};\n    Node fourth = {40, NULL};\n    third.next = &fourth;  // Append after a known node.\n\n    for (const Node *node = &first; node != NULL; node = node->next)\n        printf(\"%d\\n\", node->value);\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define CAPACITY 8\n\ntypedef struct {\n    int values[CAPACITY];\n    size_t count;\n} Stack;\n\nbool push(Stack *s, int value) {\n    if (s->count == CAPACITY) return false;\n    s->values[s->count++] = value;\n    return true;\n}\n\nbool pop(Stack *s, int *out) {\n    if (s->count == 0) return false;\n    *out = s->values[--s->count];\n    return true;\n}\n\nint main(void) {\n    Stack s = {{10, 20, 30}, 3};\n    int value;\n    if (!push(&s, 40) || !push(&s, 50)) return 1;\n    if (pop(&s, &value)) printf(\"%d\\n\", value);  // 50\n    if (pop(&s, &value)) printf(\"%d\\n\", value);  // 40\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define CAPACITY 8\n\ntypedef struct {\n    int values[CAPACITY];\n    size_t front, count;\n} Queue;\n\nbool enqueue(Queue *q, int value) {\n    if (q->count == CAPACITY) return false;\n    // Wrap around instead of moving existing elements.\n    size_t back = (q->front + q->count) % CAPACITY;\n    q->values[back] = value;\n    ++q->count;\n    return true;\n}\n\nbool dequeue(Queue *q, int *out) {\n    if (q->count == 0) return false;\n    *out = q->values[q->front];\n    q->front = (q->front + 1) % CAPACITY;\n    --q->count;\n    return true;\n}\n\nint main(void) {\n    Queue q = {{0}, 0, 0};\n    for (int value = 10; value <= 40; value += 10)\n        if (!enqueue(&q, value)) return 1;\n    int value;\n    while (dequeue(&q, &value)) printf(\"%d\\n\", value);\n    return 0;\n}", "#include <stddef.h>\n#include <stdio.h>\n\ntypedef struct Node {\n    const char *name;\n    const struct Node *children[2];\n    size_t child_count;\n} Node;\n\nvoid visit(const Node *node) {\n    if (node == NULL) return;\n    puts(node->name);  // Preorder: parent before children.\n    for (size_t i = 0; i < node->child_count; ++i)\n        visit(node->children[i]);\n}\n\nint main(void) {\n    const Node intro = {\"intro.py\", {NULL, NULL}, 0};\n    const Node agent = {\"agent.py\", {NULL, NULL}, 0};\n    const Node sensor = {\"sensor.py\", {NULL, NULL}, 0};\n    const Node python = {\"Python\", {&intro, &agent}, 2};\n    const Node robot = {\"Robot\", {&sensor, NULL}, 1};\n    const Node root = {\"Kursus\", {&python, &robot}, 2};\n    visit(&root);\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define V 5\n\nint main(void) {\n    // A=0, B=1, C=2, D=3, E=4. -1 marks an unused slot.\n    const int graph[V][3] = {\n        {1, 2, -1}, {0, 3, -1}, {0, 3, 4},\n        {1, 2, 4}, {2, 3, -1}\n    };\n    int queue[V], front = 0, back = 0;\n    bool seen[V] = {false};\n    seen[0] = true;\n    queue[back++] = 0;\n\n    while (front < back) {\n        int node = queue[front++];\n        printf(\"%c\\n\", 'A' + node);\n        for (int i = 0; i < 3 && graph[node][i] != -1; ++i) {\n            int neighbor = graph[node][i];\n            if (!seen[neighbor]) {\n                // Mark on enqueue: each node enters the queue once.\n                seen[neighbor] = true;\n                queue[back++] = neighbor;\n            }\n        }\n    }\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#include <string.h>\n#define BUCKETS 5\n#define MAX_ENTRIES 10\n\ntypedef struct Entry {\n    const char *key;\n    int value;\n    struct Entry *next;\n} Entry;\n\ntypedef struct {\n    Entry *buckets[BUCKETS];\n    Entry entries[MAX_ENTRIES];\n    size_t used;\n} Table;\n\nunsigned hash(const char *key) {\n    unsigned result = 0;\n    while (*key != '\\0')\n        result = (result + (unsigned char)*key++) % BUCKETS;\n    return result;\n}\n\nEntry *find(Table *t, const char *key) {\n    for (Entry *e = t->buckets[hash(key)]; e != NULL; e = e->next)\n        if (strcmp(e->key, key) == 0) return e;\n    return NULL;\n}\n\nbool put(Table *t, const char *key, int value) {\n    Entry *existing = find(t, key);\n    if (existing != NULL) {\n        existing->value = value;\n        return true;\n    }\n    if (t->used == MAX_ENTRIES) return false;\n    unsigned bucket = hash(key);\n    Entry *e = &t->entries[t->used++];\n    // Keys must outlive the table; literals do in this example.\n    *e = (Entry){key, value, t->buckets[bucket]};\n    t->buckets[bucket] = e;\n    return true;\n}\n\nint main(void) {\n    Table table = {0};\n    if (!put(&table, \"Bo\", 24) || !put(&table, \"Ada\", 25)) return 1;\n    printf(\"Bo: %u, Ada: %u\\n\", hash(\"Bo\"), hash(\"Ada\"));\n    // Both keys have bucket 2 and remain in the chain.\n    for (Entry *e = table.buckets[2]; e != NULL; e = e->next)\n        printf(\"%s: %d\\n\", e->key, e->value);\n s.items[this.front] = undefined;\n    this.front = (this.front + 1) % this.items.length;\n    this.count--;\n    return value;\n  }\n}\nconst queue = new Queue(8);\nfor (const n of [10, 20, 30, 40]) queue.enqueue(n);\nwhile (queue.count > 0) console.log(queue.dequeue());", "const tree = {\n  Kursus: [\"Python\", \"Robot\"],\n  Python: [\"intro.py\", \"agent.py\"],\n  Robot: [\"sensor.py\"]\n};\nfunction visit(node) {\n  console.log(node);\n  for (const child of tree[node] ?? []) visit(child);\n}\nvisit(\"Kursus\");", "const graph = {\n  A: [\"B\", \"C\"], B: [\"A\", \"D\"], C: [\"A\", \"D\", \"E\"],\n  D: [\"B\", \"C\", \"E\"], E: [\"C\", \"D\"]\n};\nconst queue = [\"A\"], seen = new Set([\"A\"]);\n// Advance an index instead of using Array.shift().\nfor (let front = 0; front < queue.length; front++) {\n  const node = queue[front];\n  console.log(node);\n  for (const next of graph[node]) {\n    if (!seen.has(next)) {\n      seen.add(next);\n      queue.push(next);\n    }\n  }\n}", "// Explicit bucket chains demonstrate collisions.\nconst buckets = Array.from({length: 5}, () => []);\nfunction hash(key) {\n  return [...key].reduce((sum, c) => sum + c.codePointAt(0), 0) % 5;\n}\nfunction put(key, value) {\n  const bucket = buckets[hash(key)];\n  const entry = bucket.find(pair => pair[0] === key);\n  if (entry) entry[1] = value;\n  else bucket.push([key, value]);\n}\nput(\"Bo\", 24);\nput(\"Ada\", 25);\nput(\"Bo\", 26);\nfor (const [key, value] of buckets[2]) console.log(`${key}: ${value}`);"], "java": ["import java.util.ArrayList;\nimport java.util.Arrays;\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<Integer> numbers = new ArrayList<>(Arrays.asList(10,20,30,40));\n        System.out.println(numbers.get(2));\n        numbers.add(0, 5);\n        for (int n : numbers) System.out.print(n + \" \");\n        System.out.println();\n    }\n}", "public class Main {\n    static class Node {\n        int value;\n        Node next;\n  }
 if(stepIndex>=steps.length-1){stop();msg('Traversal complete. Reset or play again.');return;}
 stepIndex++;const s=steps[stepIndex];highlight=chapter===4?s:s.node;visited.push(highlight);renderStage();
 if(chapter===4)msg('Visit {0}. Order: {1}.',s,visited.join(' → '));
 else if(stepIndex===steps.length-1)msg('Done. Shortest route: A → C → E (2 edges).');
 else msg('Visit {0}. Queue: [{1}].',s.node,s.queue.join(', '));
 if(stepIndex===steps.length-1)stop();
}
const graph={A:['B','C'],B:['A','D'],C:['A','D','E'],D:['B','C','E'],E:['C','D']};
function bfsSteps(){const q=['A'],seen=new Set(q),result=[];while(q.length){const node=q.shift();for(const n of graph[node])if(!seen.has(n)){seen.add(n);q.push(n);}result.push({node,queue:[...q]});}return result;}

 if(chapter===2){st.innerHTML=`<div style="padding-right:65px"><div class="vertical">${data.map((n,i)=>`<div class="box ${highlight===i?'active':''}">${n}${i===data.length-1?'<span class="pointer">← top</span>':''}</div>`).join('')}${!data.length?`<span class="empty">${t('Tom stak','Empty stack')}</span>`:''}</div><p class="muted" style="text-align:center;font-size:13px;margin:10px 0 0">${t('Push og Pop sker øverst','Push and Pop happen at the top')}</p></div>`;return;}

}

aler med gangstier. Hvilken struktur passer?','3. You need to connect rooms with walking paths. Which structure fits?')}</p><details><summary>${t('Vis mulige svar','Show possible answers')}</summary><p>1. Queue. 2. Hash Table. 3. Graph.</p></details><p class="muted" style="margin-top:16px">${t('Stack og Queue beskriver adgangsregler. De kan bygges med andre datastrukturer. Et træ er også en særlig slags graf.','Stack and Queue describe access rules. They can be built using other data structures. A tree is also a special kind of graph.')}</p></section></div>`;
