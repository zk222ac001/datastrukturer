:root{--ink:#152b40;--muted:#546578;--blue:#215ad7;--pale:#eaf0ff;--orange:#a9470d;--line:#d9e0e7;--paper:#f6f7f9;--green:#13734a;--shadow:0 12px 35px #18314f09}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 15px;font-weight:650}button:hover{border-color:var(--blue);background:var(--pale)}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #df7619;outline-offset:4px}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#1748b4;color:white}.shell{max-width:1580px;margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}aside{padding:30px 20px;border-right:1px solid var(--line);background:#fff;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:20px;font-weight:800;letter-spacing:-.6px}.brand span{color:var(--blue)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted)}.nav-label{margin:40px 12px 10px}nav{display:grid;gap:5px}nav button{text-align:left;border:0;background:none;display:flex;align-items:center;gap:12px;padding:11px 12px}nav button[aria-current=page]{background:var(--pale);color:var(--blue)}nav small{font:12px ui-monospace,monospace;opacity:.7}.sidebar-note{margin:32px 12px 18px;font-size:13px;color:var(--muted)}main{min-width:0;padding:27px 44px 40px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:31px}.offline{font-size:13px;color:var(--green)}.dot{display:inline-block;width:7px;height:7px;border-radius:100%;background:var(--green);margin-right:7px}.top-actions{display:flex;gap:8px}h1{font-size:clamp(30px,3.6vw,48px);line-height:1.15;letter-spacing:-1.8px;margin:12px 0 16px}h2{font-size:20px;line-height:1.3;margin:0 0 12px}p{margin:0 0 14px}.intro{max-width:800px;color:var(--muted);font-size:18px}.tag{font-size:12px;padding:5px 10px;border-radius:20px;background:var(--pale);color:var(--blue);font-weight:700;display:inline-block;margin-bottom:18px}.lab{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);margin-top:10px}.lab-head{padding:18px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line)}.lab-head h2{margin:0;font-size:17px}.legend{color:var(--muted);font-size:12px}.legend span{color:var(--orange);font-weight:700}.stage{min-height:280px;display:flex;align-items:center;justify-content:center;padding:25px;overflow:auto;background:radial-gradient(#dce3ed .8px,transparent .8px);background-size:17px 17px}.row{display:flex;gap:10px;align-items:center;justify-content:center;min-height:160px}.cell{width:70px;flex-shrink:0;text-align:center}.box{display:flex;align-items:center;justify-content:center;min-height:66px;border:2px solid #b7c9ee;background:#eff4ff;border-radius:11px;font:700 24px ui-monospace,monospace;transition:background .25s,border .25s,transform .25s;animation:enter .3s ease-out}.index{font:12px ui-monospace,monospace;color:var(--muted);padding-top:7px}.active .box,.box.active{background:#fff0dc;border-color:#d66c19;transform:translateY(-5px)}.visited .box{background:#e0f5e9;border-color:#3b9468}.arrow{font-size:24px;color:var(--muted)}.vertical{display:flex;flex-direction:column-reverse;gap:7px;border:2px solid #b9c7d8;border-top:0;border-radius:0 0 12px 12px;padding:12px;min-width:180px;min-height:200px;justify-content:flex-start}.vertical .box{min-height:42px;font-size:20px;position:relative}.pointer{position:absolute;left:calc(100% + 17px);font:700 13px system-ui;white-space:nowrap;color:var(--orange)}.empty{color:var(--muted);text-align:center;font-size:16px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:18px 24px;border-top:1px solid var(--line)}.controls label{font-size:13px;font-weight:700}.controls input{width:82px;padding:8px;border-radius:8px;border:1px solid #aebdcd;background:#fff}.controls input[type=text]{width:100px}.controls select{padding:8px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.message{background:#eef3fd;padding:15px 24px;color:#23477c;min-height:58px;font-size:15px;border-top:1px solid #dde6f6}.lower{display:grid;grid-template-columns:1fr 1.12fr;gap:20px;margin-top:22px}.card{padding:24px;background:white;border:1px solid var(--line);border-radius:14px}.card p{font-size:15px}.card .muted,.muted{color:var(--muted)}.code{margin:14px 0 0;padding:18px;background:#14283c;color:#e6efff;border-radius:10px;overflow:auto;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;white-space:pre}.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.code-head button{font-size:12px;padding:5px 10px}.exercise{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}details{margin-top:10px}summary{cursor:pointer;color:var(--blue);font-weight:650}details p{margin-top:9px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:25px;gap:12px}.progress{font-size:13px;color:var(--muted)}svg{max-width:100%;height:auto;display:block;min-width:400px}svg text{font:700 17px system-ui;fill:var(--ink)}svg .edge{stroke:#a1b4ce;stroke-width:3}svg .node circle,svg .node rect{fill:#edf3ff;stroke:#aac0e8;stroke-width:2;transition:fill .3s,stroke .3s}svg .seen circle,svg .seen rect{fill:#dff4e8;stroke:#4b956c}svg .current circle,svg .current rect{fill:#ffecd3;stroke:#c66713;stroke-width:3}.hash{width:100%;max-width:690px;display:grid;gap:9px}.bucket{display:flex;align-items:center;gap:14px;font-size:14px}.bucket>b{width:30px;text-align:center;color:var(--muted)}.bucket-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-height:45px;background:#f2f5fa;border:1px solid var(--line);border-radius:9px;flex:1;padding:7px 12px}.bucket.current .bucket-line{background:#fff0dc;border-color:#d66c19}.entry{padding:4px 9px;background:white;border:1px solid #b8c9e2;border-radius:6px;font-family:ui-monospace,monospace}.quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.question{margin:0;padding:23px;border:1px solid var(--line);border-radius:13px;background:white}.question legend{float:left;width:100%;font-weight:750;margin-bottom:15px}.question label{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:7px;cursor:pointer}.question label:hover{background:var(--pale)}.question input{margin-top:6px;accent-color:var(--blue)}.feedback{margin-top:10px;font-size:14px;color:var(--green)}.wrong{color:#a33223}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white;font-size:15px}td,th{text-align:left;vertical-align:top;padding:14px;border-bottom:1px solid var(--line)}th{background:#eaf0fb}.guide{max-width:850px}.guide li{margin-bottom:10px}.guide code{background:#e7edf7;padding:2px 6px;border-radius:4px}dialog{max-width:760px;width:calc(100% - 36px);border:1px solid var(--line);border-radius:18px;padding:30px;color:var(--ink)}dialog::backdrop{background:#0c1d35aa}.projector .shell{grid-template-columns:1fr}.projector aside,.projector .lower{display:none}.projector main{max-width:1450px;width:100%;margin:auto}.projector .stage{min-height:380px}.projector .message{font-size:21px}.projector .box{min-height:85px;font-size:30px}.projector .cell{width:85px}.projector .vertical .box{min-height:48px;font-size:24px}.projector .controls button{font-size:18px}.projector .intro{font-size:22px}.projector .topbar{margin-bottom:15px}@keyframes enter{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:1000px){.shell{grid-template-columns:195px 1fr}aside{padding:25px 12px}main{padding:25px}.lower{grid-template-columns:1fr}.legend{display:none}}@media(max-width:700px){.shell{display:block}aside{position:static;height:auto;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.nav-label,.sidebar-note{display:none}nav{display:flex;overflow:auto;margin-top:15px}nav button{white-space:nowrap;font-size:14px}nav small{display:none}main{padding:20px 14px}.topbar{align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:24px}.top-actions button{font-size:13px;padding:7px 10px}.stage{justify-content:flex-start;padding:20px;min-height:260px}.stage>div,.stage>svg{margin:auto}.cell{width:55px}.box{font-size:21px;min-height:55px}.row{gap:7px}.quiz-grid{grid-template-columns:1fr}.lab-head,.controls,.message{padding:15px}.card{padding:19px}.bottom button{font-size:13px}.projector .stage{min-height:300px}}@media print{aside,.topbar,.controls,.bottom,button,dialog{display:none!important}.shell{display:block}main{padding:0}.lab,.card{break-inside:avoid;box-shadow:none}.lower{display:block}.card{margin-top:12px}.code{white-space:pre-wrap}body{background:white}}

<script>
'use strict';
const DATA={"lessons": {"da": [{"title": "Array", "sub": "En række med adresser", "tag": "Indeks · Direkte adgang", "intro": "Et array organiserer elementer i en rækkefølge. Et indeks fortæller, hvilken plads vi vil læse. Det første indeks er 0.", "idea": "Tænk på nummererede skabe: Du kan gå direkte til skab 2 uden først at åbne skab 0 og 1.", "use": "Bruges til f.eks. måledata, pixelværdier og tabeller med en fast struktur.", "cost": "Opslag via indeks: O(1). Indsættelse midt i et sammenhængende array: O(n), fordi efterfølgende elementer flyttes.", "note": "Python bruger en list: et dynamisk array af referencer. C-eksemplet bruger et fast, typet array; vi holder separat styr på antallet af elementer.", "exercise": "Hvilket indeks skal du bruge for at læse tallet 40? Hvad sker der med indeksene efter indsættelse forrest?", "answer": "40 ligger først på indeks 3. Ved indsættelse forrest flyttes alle eksisterende elementer én plads mod højre.", "code": "tal = [10, 20, 30, 40]\nprint(tal[2])       # 30\n\ntal.insert(0, 5)    # Indsæt forrest\nprint(tal)         # [5, 10, 20, 30, 40]"}, {"title": "Linked List", "sub": "En kæde af noder", "tag": "Noder · Referencer", "intro": "Hver node gemmer en værdi og en reference til den næste node. Vi starter ved head og følger referencerne gennem kæden.", "idea": "Tænk på en skattejagt: Hver seddel fortæller, hvor den næste ligger. Du kan ikke springe direkte til seddel nummer fire.", "use": "Bruges, når man vil forbinde noder og kunne ændre kæden uden at flytte alle værdier i hukommelsen.", "cost": "Opslag på en position: O(n). Indsættelse lige efter en allerede kendt node: O(1). At finde noden kan tage O(n).", "note": "Tegningen viser en enkeltkædet liste. Noderne behøver ikke ligge ved siden af hinanden i hukommelsen. C-eksemplet bruger lokale noder og pointere; NULL markerer slutningen.", "exercise": "Hvor mange noder besøger du for at finde 30 i den oprindelige kæde?", "answer": "Tre: 10, derefter 20, derefter 30. En linked list har ikke arrays direkte opslag via indeks.", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"title": "Stack", "sub": "Sidste ind. Første ud.", "tag": "LIFO · Last In, First Out", "intro": "En stak har én ende, som vi bruger: toppen. Push lægger noget på toppen. Pop fjerner det øverste element.", "idea": "Tænk på en stak tallerkener. Den tallerken, du lægger øverst, er den næste, du tager.", "use": "Bruges til undo-funktioner, dybdesøgning og til at holde styr på funktionskald.", "cost": "Push og pop: normalt O(1). For Pythons list er append amortiseret O(1), og pop fra slutningen er O(1).", "note": "LIFO beskriver adfærden. En stack kan implementeres med forskellige underliggende datastrukturer. C-eksemplet kontrollerer både kapacitet og tom stak.", "exercise": "Tryk Nulstil. Tilføj 40 og derefter 50. Hvilke to tal fjernes først?", "answer": "50 fjernes først, derefter 40. Den senest tilføjede værdi ligger øverst.", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"title": "Queue", "sub": "Første ind. Første ud.", "tag": "FIFO · First In, First Out", "intro": "En kø får nye elementer bagest og fjerner elementer forrest. Den, der har ventet længst, kommer først til.", "idea": "Tænk på køen ved kassen. Nye kunder stiller sig bagest, og den forreste kunde bliver betjent først.", "use": "Bruges til printerkøer, opgavebehandling og breddesøgning i grafer.", "cost": "Enqueue og dequeue: O(1) med f.eks. collections.deque. At fjerne forrest i en Python-list tager derimod O(n).", "note": "Visualiseringen viser den logiske rækkefølge. En effektiv kø behøver ikke flytte alle elementer, når den fjerner det forreste. C-eksemplet bruger en cirkulær buffer.", "exercise": "Tryk Nulstil. Tilføj 40. Hvilket tal fjernes ved det næste Dequeue?", "answer": "10. Det stod allerede forrest, før 40 blev tilføjet bagest.", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"title": "Tree", "sub": "Data i et hierarki", "tag": "Rod · Forælder · Barn", "intro": "Et træ forbinder noder i et hierarki uden cykler. I et rodfæstet træ har hver node, undtagen roden, præcis én forælder.", "idea": "Tænk på mapper: Kursus er roden. Python og Robot er undermapper. De nederste noder er blade.", "use": "Bruges til mappehierarkier, dokumentstrukturer, beslutningstræer og søgetræer.", "cost": "At gennemløbe alle noder: O(n). Opslag er ikke automatisk O(log n); det kræver f.eks. et balanceret søgetræ.", "note": "Vi viser preorder: Besøg først noden og derefter dens børn fra venstre mod højre. Dette er et almindeligt hierarki, ikke et binært søgetræ.", "exercise": "Hvilken node besøges efter Python ved denne preorder-gennemgang?", "answer": "intro.py. Vi besøger Pythons børn, før vi går videre til søskenden Robot.", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"title": "Graph", "sub": "Et netværk af forbindelser", "tag": "Noder · Kanter · Mulige cykler", "intro": "En graf består af noder og kanter. Den kan beskrive et netværk, hvor der er flere veje mellem to steder.", "idea": "Tænk på byer forbundet med veje. Noder er byer, og kanter er veje. Her tæller vi antal forbindelser, ikke kilometer.", "use": "Bruges til navigation, computernetværk, sociale relationer og afhængigheder.", "cost": "Breddesøgning (BFS) med nabolister: O(V + E), hvor V er antal noder, og E er antal kanter.", "note": "Denne graf er urettet og uvægtet. BFS finder korteste afstand målt i antal kanter. Vægtede veje kræver en passende anden algoritme. Kodeeksemplerne bruger nabolister. C++-eksemplet bruger ordnede map/set-containere, som tilføjer logaritmiske opslagsomkostninger.", "exercise": "Hvorfor har vi brug for et seen-sæt? Hvilken korteste rute finder demoen fra A til E?", "answer": "seen forhindrer gentagne besøg i cyklen. Demoen finder A → C → E, som har to kanter.", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"title": "Hash Table", "sub": "Find værdien med en nøgle", "tag": "Nøgle → Hash → Plads", "intro": "En hashfunktion omsætter en nøgle til en plads i en tabel. Flere nøgler kan ramme samme plads; det kaldes en kollision.", "idea": "Tænk på et register: Du slår op med et navn og får den tilhørende værdi, uden normalt at gennemgå hele registret.", "use": "Bruges til hurtige opslag, caches og optælling. Pythons dict er en hashbaseret struktur.", "cost": "Opslag og indsættelse: gennemsnitligt O(1) under passende betingelser. I værste fald kan de tage O(n).", "note": "Demoen bruger sum(ord(tegn)) % 5 og kæder i hver bucket. Det er en undervisningsmodel; Python dict bruger en anden hash- og kollisionsmekanisme. C-eksemplet hasher bytes; for demoens ASCII-navne svarer bucketnumrene til animationens.", "exercise": "Gem Bo og derefter Ada. Hvorfor kan begge ligge i bucket 2 uden at overskrive hinanden?", "answer": "De har forskellige nøgler, men samme hashplads: Bo → 177 % 5 = 2 og Ada → 262 % 5 = 2. Vi gemmer begge nøgle-værdi-par i bucketens kæde.", "code": "student = {\n    \"navn\": \"Ali\",\n    \"alder\": 22,\n    \"by\": \"Roskilde\",\n}\n\nprint(student[\"navn\"])  # Ali\nstudent[\"alder\"] = 23   # Opdater\n\n# Demoens simple hash (ikke dicts interne hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}], "en": [{"title": "Array", "sub": "A row with addresses", "tag": "Index · Direct access", "intro": "An array organises elements in a sequence. An index identifies the position we want to read. The first index is 0.", "idea": "Think of numbered lockers: you can go straight to locker 2 without opening lockers 0 and 1 first.", "use": "Useful for measurements, pixel values and tables with a fixed structure.", "cost": "Access by index: O(1). Inserting into the middle of a contiguous array: O(n), because later elements must move.", "note": "The Python example uses a list: a dynamic array of references. C uses a fixed-size, typed array here; we track the number of elements separately.", "exercise": "Which index reads the value 40? What happens to the existing indices when you insert at the front?", "answer": "Initially, 40 is at index 3. Inserting at the front shifts every existing element one position to the right.", "code": "numbers = [10, 20, 30, 40]\nprint(numbers[2])       # 30\n\nnumbers.insert(0, 5)    # Insert at the front\nprint(numbers)         # [5, 10, 20, 30, 40]"}, {"title": "Linked List", "sub": "A chain of nodes", "tag": "Nodes · References", "intro": "Each node stores a value and a reference to the next node. Start at head and follow the references through the chain.", "idea": "Think of a treasure hunt: each clue tells you where the next clue is. You cannot jump directly to the fourth clue.", "use": "Useful for connecting nodes and changing links without moving all the values in memory.", "cost": "Access by position: O(n). Inserting after a node you already have: O(1). Finding that node can take O(n).", "note": "This is a singly linked list. Nodes need not be adjacent in memory. The C example uses local nodes and pointers; NULL marks the end.", "exercise": "How many nodes do you visit to find 30 in the original chain?", "answer": "Three: 10, then 20, then 30. A linked list does not support the direct index access of an array.", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"title": "Stack", "sub": "Last in. First out.", "tag": "LIFO · Last In, First Out", "intro": "A stack has one end that we use: the top. Push adds an element to the top. Pop removes the top element.", "idea": "Think of a stack of plates. The plate you put on top is the next one you take.", "use": "Used for undo operations, depth-first search and tracking function calls.", "cost": "Push and pop: normally O(1). Python list.append is amortised O(1), and pop from the end is O(1).", "note": "LIFO describes behaviour. A stack can use different underlying structures. The C example checks both capacity and an empty stack.", "exercise": "Reset. Push 40 and then 50. Which two values are removed first?", "answer": "50 is removed first, then 40. The most recently added value is on top.", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"title": "Queue", "sub": "First in. First out.", "tag": "FIFO · First In, First Out", "intro": "A queue adds new elements at the back and removes elements from the front. The element waiting longest is served first.", "idea": "Think of a checkout queue. New customers join at the back; the customer at the front is served first.", "use": "Used for print queues, task processing and breadth-first search in graphs.", "cost": "Enqueue and dequeue: O(1) with collections.deque or a circular buffer. Removing the first item from a Python list takes O(n).", "note": "The animation shows the logical order. The C example uses a circular buffer, so removing an item does not shift all the other items.", "exercise": "Reset and enqueue 40. Which value will the next Dequeue remove?", "answer": "10. It was already at the front before 40 was added at the back.", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"title": "Tree", "sub": "Data in a hierarchy", "tag": "Root · Parent · Child", "intro": "A tree connects nodes in a hierarchy without cycles. In a rooted tree, every node except the root has exactly one parent.", "idea": "Think of folders: Kursus is the root. Python and Robot are subfolders. The bottom nodes are leaves.", "use": "Used for folder hierarchies, document structures, decision trees and search trees.", "cost": "Traversing every node: O(n). Lookup is not automatically O(log n); that requires a structure such as a balanced search tree.", "note": "We show preorder: visit the node, then its children from left to right. This is a general hierarchy, not a binary search tree. The sample folder names stay unchanged in both languages.", "exercise": "Which node is visited after Python in this preorder traversal?", "answer": "intro.py. We visit the children of Python before moving on to its sibling Robot.", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"title": "Graph", "sub": "A network of connections", "tag": "Nodes · Edges · Possible cycles", "intro": "A graph consists of nodes and edges. It can model a network with several routes between two places.", "idea": "Think of cities connected by roads. Nodes are cities and edges are roads. Here we count connections, not kilometres.", "use": "Used for navigation, computer networks, social relationships and dependencies.", "cost": "Breadth-first search (BFS) using adjacency lists: O(V + E), where V is the number of nodes and E the number of edges.", "note": "This graph is undirected and unweighted. BFS finds the shortest distance in number of edges. Weighted roads need a suitable different algorithm. The code examples use adjacency lists. The C++ example uses ordered map/set containers, which add logarithmic lookup costs.", "exercise": "Why do we need a seen set? Which shortest route does this demo find from A to E?", "answer": "seen prevents repeated visits around a cycle. The demo finds A → C → E, which has two edges.", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"title": "Hash Table", "sub": "Find a value using its key", "tag": "Key → Hash → Bucket", "intro": "A hash function maps a key to a bucket in a table. Different keys can reach the same bucket; this is called a collision.", "idea": "Think of a register: look up a name to get its value, usually without searching the entire register.", "use": "Used for fast lookups, caches and counting. Python dict is a hash-based structure.", "cost": "Lookup and insertion: O(1) on average under suitable conditions. In the worst case they can take O(n).", "note": "The animation uses sum(ord(character)) % 5 and bucket chains. Python dict uses different hashing and collision handling. The C example hashes bytes; for the ASCII names used here the bucket numbers match the animation.", "exercise": "Store Bo and then Ada. Why can both stay in bucket 2 without overwriting each other?", "answer": "The keys differ but share a bucket: Bo → 177 % 5 = 2 and Ada → 262 % 5 = 2. We keep both key–value pairs in the bucket chain.", "code": "student = {\n    \"name\": \"Ali\",\n    \"age\": 22,\n    \"city\": \"Roskilde\",\n}\n\nprint(student[\"name\"])  # Ali\nstudent[\"age\"] = 23     # Update\n\n# A simple teaching hash (not the internal dict hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}], "es": [{"sub": "Una fila con índices", "intro": "Un array guarda elementos en orden. El índice identifica una posición y empieza en 0.", "idea": "Como taquillas numeradas: puedes ir directamente a la número 2.", "use": "Mediciones, píxeles y tablas.", "cost": "Acceso por índice: O(1). Insertar al principio: O(n), porque hay que desplazar elementos.", "note": "Python usa una lista dinámica; C utiliza aquí un array de capacidad fija.", "exercise": "¿En qué índice está 40? ¿Qué cambia al insertar al principio?", "answer": "Inicialmente está en el índice 3. Todos los elementos existentes se desplazan una posición.", "title": "Array", "tag": "Una fila con índices", "code": "numbers = [10, 20, 30, 40]\nprint(numbers[2])       # 30\n\nnumbers.insert(0, 5)    # Insert at the front\nprint(numbers)         # [5, 10, 20, 30, 40]"}, {"sub": "Una cadena de nodos", "intro": "Cada nodo contiene un valor y una referencia al siguiente. El recorrido empieza en head.", "idea": "Como una búsqueda del tesoro: cada pista conduce a la siguiente.", "use": "Cadenas dinámicas y cambios de enlaces.", "cost": "Buscar una posición: O(n). Insertar después de un nodo conocido: O(1).", "note": "Una lista simplemente enlazada termina en una referencia vacía. Sus nodos no necesitan estar juntos en memoria.", "exercise": "¿Cuántos nodos visitas para encontrar 30 en la cadena original?", "answer": "Tres: 10, 20 y 30. No hay acceso directo por índice.", "title": "Linked List", "tag": "Una cadena de nodos", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"sub": "Último en entrar, primero en salir", "intro": "Push añade un elemento arriba. Pop retira el elemento superior. Esta regla se llama LIFO.", "idea": "Como una pila de platos: retiras primero el último que colocaste.", "use": "Deshacer acciones, llamadas a funciones y búsqueda en profundidad.", "cost": "Push y pop: O(1) con una implementación adecuada; append de Python tiene coste amortizado O(1).", "note": "Una pila describe una regla de acceso. Comprueba si está vacía antes de retirar elementos.", "exercise": "Reinicia, añade 40 y después 50. ¿Cuáles salen primero?", "answer": "Primero 50 y luego 40: el último añadido queda arriba.", "title": "Stack", "tag": "Último en entrar, primero en salir", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"sub": "Primero en entrar, primero en salir", "intro": "Enqueue añade al final. Dequeue retira del principio. Esta regla se llama FIFO.", "idea": "Como una cola de supermercado: se atiende primero a quien llegó antes.", "use": "Impresión, tareas pendientes y búsqueda en anchura.", "cost": "Enqueue y dequeue: O(1) con deque o un búfer circular.", "note": "La animación muestra el orden lógico. Un búfer circular no desplaza todos los elementos al retirar uno.", "exercise": "Reinicia y añade 40. ¿Qué retira el siguiente Dequeue?", "answer": "10: ya estaba al principio antes de que llegara 40.", "title": "Queue", "tag": "Primero en entrar, primero en salir", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"sub": "Datos en una jerarquía", "intro": "Un árbol no tiene ciclos. En un árbol con raíz, cada nodo salvo la raíz tiene exactamente un padre.", "idea": "Kursus es la carpeta raíz; Python y Robot son sus subcarpetas.", "use": "Carpetas, documentos y árboles de decisión.", "cost": "Recorrer todos los nodos: O(n). Buscar no es siempre O(log n); depende del tipo de árbol.", "note": "Usamos preorden: primero el nodo y después sus hijos de izquierda a derecha. Los nombres de archivos se conservan.", "exercise": "¿Qué nodo se visita después de Python?", "answer": "intro.py: visitamos los hijos antes de pasar a Robot.", "title": "Tree", "tag": "Datos en una jerarquía", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"sub": "Una red de conexiones", "intro": "Un grafo contiene nodos y aristas. Puede tener ciclos y varias rutas entre dos nodos.", "idea": "Las ciudades son nodos y las carreteras son aristas.", "use": "Navegación, redes informáticas y relaciones.", "cost": "BFS con listas de adyacencia: O(V + E). Los contenedores ordenados de C++ añaden costes logarítmicos.", "note": "Aquí el grafo no tiene dirección ni pesos. BFS minimiza el número de aristas, no los kilómetros.", "exercise": "¿Para qué sirve seen? ¿Cuál es la ruta mínima de A a E?", "answer": "Evita visitas repetidas. La ruta de la demostración es A → C → E, con dos aristas.", "title": "Graph", "tag": "Una red de conexiones", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"sub": "Buscar mediante una clave", "intro": "Una función hash asigna una clave a un contenedor. Dos claves pueden compartirlo: eso es una colisión.", "idea": "Como consultar un registro por nombre sin revisar normalmente todo el registro.", "use": "Búsquedas rápidas, cachés y recuentos.", "cost": "Búsqueda e inserción: O(1) en promedio; en el peor caso pueden ser O(n).", "note": "La demo suma códigos Unicode y calcula % 5. Las bibliotecas pueden usar otras funciones; C suma bytes para estos nombres ASCII.", "exercise": "Guarda Bo y Ada. ¿Por qué no se sobrescriben?", "answer": "Ambos llegan al contenedor 2: 177 % 5 y 262 % 5. La cadena conserva los dos pares.", "title": "Hash Table", "tag": "Buscar mediante una clave", "code": "student = {\n    \"name\": \"Ali\",\n    \"age\": 22,\n    \"city\": \"Roskilde\",\n}\n\nprint(student[\"name\"])  # Ali\nstudent[\"age\"] = 23     # Update\n\n# A simple teaching hash (not the internal dict hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}], "fr": [{"sub": "Une rangée indexée", "intro": "Un tableau conserve les éléments dans un ordre. Chaque position a un indice, à partir de 0.", "idea": "Comme des casiers numérotés : on accède directement au casier 2.", "use": "Mesures, pixels et tableaux de données.", "cost": "Accès par indice : O(1). Insertion au début : O(n), car les éléments suivants se déplacent.", "note": "Python utilise une liste dynamique ; l’exemple C utilise un tableau de capacité fixe.", "exercise": "Quel est l’indice de 40 ? Que change une insertion au début ?", "answer": "Au départ, 40 est à l’indice 3. Chaque élément existant avance d’une position.", "title": "Array", "tag": "Une rangée indexée", "code": "numbers = [10, 20, 30, 40]\nprint(numbers[2])       # 30\n\nnumbers.insert(0, 5)    # Insert at the front\nprint(numbers)         # [5, 10, 20, 30, 40]"}, {"sub": "Une chaîne de nœuds", "intro": "Chaque nœud contient une valeur et une référence au suivant. Le parcours commence à head.", "idea": "Comme une chasse au trésor : chaque indice mène au suivant.", "use": "Chaînes dynamiques et modification des liens.", "cost": "Recherche par position : O(n). Insertion après un nœud déjà connu : O(1).", "note": "Cette liste simplement chaînée se termine par une référence vide. Les nœuds ne sont pas forcément voisins en mémoire.", "exercise": "Combien de nœuds faut-il visiter pour trouver 30 ?", "answer": "Trois : 10, 20, puis 30. Il n’y a pas d’accès direct par indice.", "title": "Linked List", "tag": "Une chaîne de nœuds", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"sub": "Dernier entré, premier sorti", "intro": "Push ajoute au sommet. Pop retire l’élément du sommet. C’est la règle LIFO.", "idea": "Comme une pile d’assiettes : on prend d’abord la dernière posée.", "use": "Annulation, appels de fonctions et recherche en profondeur.", "cost": "Push et pop : O(1) avec une implémentation adaptée ; append en Python est amorti O(1).", "note": "Une pile définit une règle d’accès. Vérifiez qu’elle n’est pas vide avant de retirer un élément.", "exercise": "Réinitialisez, ajoutez 40 puis 50. Quels éléments sortent d’abord ?", "answer": "50, puis 40. Le dernier élément ajouté est au sommet.", "title": "Stack", "tag": "Dernier entré, premier sorti", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"sub": "Premier entré, premier sorti", "intro": "Enqueue ajoute à la fin. Dequeue retire au début. C’est la règle FIFO.", "idea": "Comme une file d’attente : la première personne arrivée est servie d’abord.", "use": "Impression, traitement de tâches et recherche en largeur.", "cost": "Ajout et retrait : O(1) avec deque ou un tampon circulaire.", "note": "L’animation montre l’ordre logique. Un tampon circulaire évite de déplacer tous les éléments lors d’un retrait.", "exercise": "Réinitialisez et ajoutez 40. Que retire le prochain Dequeue ?", "answer": "10, qui était déjà en tête avant l’arrivée de 40.", "title": "Queue", "tag": "Premier entré, premier sorti", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"sub": "Des données hiérarchisées", "intro": "Un arbre n’a pas de cycle. Dans un arbre enraciné, chaque nœud sauf la racine a exactement un parent.", "idea": "Kursus est le dossier racine ; Python et Robot sont ses sous-dossiers.", "use": "Dossiers, documents et arbres de décision.", "cost": "Parcours complet : O(n). La recherche n’est pas toujours O(log n) : cela dépend de l’arbre.", "note": "Le préordre visite le nœud avant ses enfants, de gauche à droite. Les noms de fichiers restent inchangés.", "exercise": "Quel nœud vient après Python ?", "answer": "intro.py : on visite les enfants de Python avant de passer à Robot.", "title": "Tree", "tag": "Des données hiérarchisées", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"sub": "Un réseau de connexions", "intro": "Un graphe contient des sommets et des arêtes. Il peut avoir des cycles et plusieurs chemins entre deux sommets.", "idea": "Les villes sont des sommets, les routes sont des arêtes.", "use": "Navigation, réseaux informatiques et relations.", "cost": "BFS avec listes d’adjacence : O(V + E). Les conteneurs ordonnés C++ ajoutent des coûts logarithmiques.", "note": "Ce graphe est non orienté et non pondéré. BFS minimise le nombre d’arêtes, pas les kilomètres.", "exercise": "Pourquoi utiliser seen ? Quel est le plus court chemin de A à E ?", "answer": "seen évite les visites répétées. La démo trouve A → C → E, soit deux arêtes.", "title": "Graph", "tag": "Un réseau de connexions", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"sub": "Retrouver une valeur par sa clé", "intro": "Une fonction de hachage associe une clé à un compartiment. Deux clés peuvent partager ce compartiment : c’est une collision.", "idea": "Comme un registre consulté par nom, sans parcourir normalement toutes les entrées.", "use": "Recherches rapides, caches et comptages.", "cost": "Recherche et insertion : O(1) en moyenne, mais jusqu’à O(n) dans le pire cas.", "note": "La démo additionne les codes Unicode puis applique % 5. Les bibliothèques utilisent d’autres hachages ; C additionne les octets de ces noms ASCII.", "exercise": "Enregistrez Bo puis Ada. Pourquoi les deux restent-ils présents ?", "answer": "Les deux arrivent dans le compartiment 2 : 177 % 5 et 262 % 5. La chaîne conserve les deux paires.", "title": "Hash Table", "tag": "Retrouver une valeur par sa clé", "code": "student = {\n    \"name\": \"Ali\",\n    \"age\": 22,\n    \"city\": \"Roskilde\",\n}\n\nprint(student[\"name\"])  # Ali\nstudent[\"age\"] = 23     # Update\n\n# A simple teaching hash (not the internal dict hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}], "de": [{"sub": "Eine Reihe mit Indizes", "intro": "Ein Array speichert Elemente in einer Reihenfolge. Der Index bezeichnet eine Position und beginnt bei 0.", "idea": "Wie nummerierte Schließfächer: Fach 2 ist direkt erreichbar.", "use": "Messwerte, Pixel und Datentabellen.", "cost": "Zugriff per Index: O(1). Einfügen am Anfang: O(n), weil Elemente verschoben werden.", "note": "Python verwendet eine dynamische Liste; C nutzt hier ein Array mit fester Kapazität.", "exercise": "Welchen Index hat 40? Was passiert beim Einfügen am Anfang?", "answer": "Zunächst Index 3. Alle vorhandenen Elemente rücken eine Position weiter.", "title": "Array", "tag": "Eine Reihe mit Indizes", "code": "numbers = [10, 20, 30, 40]\nprint(numbers[2])       # 30\n\nnumbers.insert(0, 5)    # Insert at the front\nprint(numbers)         # [5, 10, 20, 30, 40]"}, {"sub": "Eine Kette von Knoten", "intro": "Jeder Knoten enthält einen Wert und einen Verweis auf den nächsten. Der Durchlauf beginnt bei head.", "idea": "Wie eine Schatzsuche: Jeder Hinweis führt zum nächsten.", "use": "Dynamische Ketten und Änderungen an Verknüpfungen.", "cost": "Suche nach Position: O(n). Einfügen nach einem bereits bekannten Knoten: O(1).", "note": "Die einfach verkettete Liste endet mit einem leeren Verweis. Knoten müssen im Speicher nicht nebeneinander liegen.", "exercise": "Wie viele Knoten werden besucht, um 30 zu finden?", "answer": "Drei: 10, 20 und 30. Ein direkter Indexzugriff ist nicht möglich.", "title": "Linked List", "tag": "Eine Kette von Knoten", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"sub": "Zuletzt hinein, zuerst heraus", "intro": "Push legt ein Element oben ab. Pop entfernt das oberste Element. Das ist LIFO.", "idea": "Wie ein Tellerstapel: Der zuletzt abgelegte Teller wird zuerst genommen.", "use": "Rückgängig-Funktionen, Funktionsaufrufe und Tiefensuche.", "cost": "Push und Pop: O(1) bei geeigneter Umsetzung; Python append ist amortisiert O(1).", "note": "Ein Stack beschreibt eine Zugriffsregel. Vor dem Entfernen muss auf einen leeren Stack geprüft werden.", "exercise": "Zurücksetzen, dann 40 und 50 hinzufügen. Was wird zuerst entfernt?", "answer": "Zuerst 50, dann 40. Das zuletzt eingefügte Element liegt oben.", "title": "Stack", "tag": "Zuletzt hinein, zuerst heraus", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"sub": "Zuerst hinein, zuerst heraus", "intro": "Enqueue fügt hinten hinzu. Dequeue entfernt vorne. Das ist FIFO.", "idea": "Wie eine Warteschlange: Wer zuerst kommt, wird zuerst bedient.", "use": "Druckaufträge, Aufgabenverarbeitung und Breitensuche.", "cost": "Einfügen und Entfernen: O(1) mit deque oder einem Ringpuffer.", "note": "Die Animation zeigt die logische Reihenfolge. Ein Ringpuffer verschiebt beim Entfernen nicht alle Elemente.", "exercise": "Zurücksetzen und 40 hinzufügen. Was entfernt das nächste Dequeue?", "answer": "10 stand bereits vorne, bevor 40 hinzugefügt wurde.", "title": "Queue", "tag": "Zuerst hinein, zuerst heraus", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"sub": "Daten in einer Hierarchie", "intro": "Ein Baum enthält keine Zyklen. In einem gewurzelten Baum hat jeder Knoten außer der Wurzel genau einen Elternknoten.", "idea": "Kursus ist der Hauptordner; Python und Robot sind Unterordner.", "use": "Ordner, Dokumente und Entscheidungsbäume.", "cost": "Alle Knoten besuchen: O(n). Suchen ist nicht immer O(log n); das hängt von der Baumart ab.", "note": "Preorder besucht zuerst den Knoten, dann seine Kinder von links nach rechts. Dateinamen bleiben unverändert.", "exercise": "Welcher Knoten folgt auf Python?", "answer": "intro.py: Die Kinder von Python kommen vor dem Nachbarknoten Robot.", "title": "Tree", "tag": "Daten in einer Hierarchie", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"sub": "Ein Netz aus Verbindungen", "intro": "Ein Graph besteht aus Knoten und Kanten. Zyklen und mehrere Wege zwischen zwei Knoten sind möglich.", "idea": "Städte sind Knoten, Straßen sind Kanten.", "use": "Navigation, Computernetze und Beziehungen.", "cost": "BFS mit Nachbarschaftslisten: O(V + E). Geordnete C++-Container verursachen zusätzliche logarithmische Kosten.", "note": "Dieser Graph ist ungerichtet und ungewichtet. BFS minimiert die Kantenzahl, nicht die Kilometer.", "exercise": "Warum brauchen wir seen? Was ist der kürzeste Weg von A nach E?", "answer": "seen verhindert wiederholte Besuche. Die Demo findet A → C → E mit zwei Kanten.", "title": "Graph", "tag": "Ein Netz aus Verbindungen", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"sub": "Werte über Schlüssel finden", "intro": "Eine Hashfunktion ordnet einem Schlüssel einen Bucket zu. Teilen zwei Schlüssel einen Bucket, entsteht eine Kollision.", "idea": "Wie ein Register, das normalerweise direkt über einen Namen durchsucht wird.", "use": "Schnelle Suche, Caches und Zählungen.", "cost": "Suche und Einfügen: durchschnittlich O(1), im schlechtesten Fall O(n).", "note": "Die Demo summiert Unicode-Codepunkte und rechnet % 5. Bibliotheken verwenden andere Verfahren; C summiert Bytes dieser ASCII-Namen.", "exercise": "Bo und Ada speichern: Warum werden beide behalten?", "answer": "Beide landen in Bucket 2: 177 % 5 und 262 % 5. Die Kette bewahrt beide Schlüssel-Wert-Paare.", "title": "Hash Table", "tag": "Werte über Schlüssel finden", "code": "student = {\n    \"name\": \"Ali\",\n    \"age\": 22,\n    \"city\": \"Roskilde\",\n}\n\nprint(student[\"name\"])  # Ali\nstudent[\"age\"] = 23     # Update\n\n# A simple teaching hash (not the internal dict hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}], "pt": [{"sub": "Uma sequência com índices", "intro": "Um array guarda elementos em ordem. O índice identifica uma posição e começa em 0.", "idea": "Como armários numerados: é possível ir diretamente ao armário 2.", "use": "Medições, pixels e tabelas de dados.", "cost": "Acesso por índice: O(1). Inserir no início: O(n), pois os elementos precisam ser deslocados.", "note": "Python usa uma lista dinâmica; C usa aqui um array com capacidade fixa.", "exercise": "Qual é o índice de 40? O que muda ao inserir no início?", "answer": "Inicialmente é 3. Cada elemento existente avança uma posição.", "title": "Array", "tag": "Uma sequência com índices", "code": "numbers = [10, 20, 30, 40]\nprint(numbers[2])       # 30\n\nnumbers.insert(0, 5)    # Insert at the front\nprint(numbers)         # [5, 10, 20, 30, 40]"}, {"sub": "Uma cadeia de nós", "intro": "Cada nó guarda um valor e uma referência para o próximo. O percurso começa em head.", "idea": "Como uma caça ao tesouro: cada pista leva à seguinte.", "use": "Cadeias dinâmicas e alterações nas ligações.", "cost": "Procurar uma posição: O(n). Inserir após um nó já conhecido: O(1).", "note": "Esta lista simplesmente ligada termina numa referência vazia. Os nós não precisam estar lado a lado na memória.", "exercise": "Quantos nós são visitados para encontrar 30?", "answer": "Três: 10, 20 e 30. Não existe acesso direto por índice.", "title": "Linked List", "tag": "Uma cadeia de nós", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"sub": "Último a entrar, primeiro a sair", "intro": "Push adiciona ao topo. Pop remove o elemento do topo. Esta regra chama-se LIFO.", "idea": "Como uma pilha de pratos: retira-se primeiro o último prato colocado.", "use": "Desfazer ações, chamadas de funções e pesquisa em profundidade.", "cost": "Push e pop: O(1) com implementação adequada; append de Python tem custo amortizado O(1).", "note": "Uma pilha define uma regra de acesso. Verifique se está vazia antes de remover.", "exercise": "Reinicie, adicione 40 e depois 50. Quais saem primeiro?", "answer": "Primeiro 50, depois 40. O último valor adicionado fica no topo.", "title": "Stack", "tag": "Último a entrar, primeiro a sair", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"sub": "Primeiro a entrar, primeiro a sair", "intro": "Enqueue adiciona no fim. Dequeue remove do início. Esta regra chama-se FIFO.", "idea": "Como uma fila: quem chega primeiro é atendido primeiro.", "use": "Filas de impressão, tarefas e pesquisa em largura.", "cost": "Adicionar e remover: O(1) com deque ou um buffer circular.", "note": "A animação mostra a ordem lógica. Um buffer circular não desloca todos os elementos ao remover um.", "exercise": "Reinicie e adicione 40. O que sai no próximo Dequeue?", "answer": "10, que já estava no início antes da chegada de 40.", "title": "Queue", "tag": "Primeiro a entrar, primeiro a sair", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"sub": "Dados numa hierarquia", "intro": "Uma árvore não tem ciclos. Numa árvore com raiz, cada nó exceto a raiz tem exatamente um pai.", "idea": "Kursus é a pasta raiz; Python e Robot são subpastas.", "use": "Pastas, documentos e árvores de decisão.", "cost": "Visitar todos os nós: O(n). Procurar não é sempre O(log n); depende da árvore.", "note": "A pré-ordem visita o nó antes dos filhos, da esquerda para a direita. Os nomes dos ficheiros não mudam.", "exercise": "Qual nó é visitado depois de Python?", "answer": "intro.py: os filhos de Python são visitados antes de Robot.", "title": "Tree", "tag": "Dados numa hierarquia", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"sub": "Uma rede de ligações", "intro": "Um grafo contém nós e arestas. Pode ter ciclos e vários caminhos entre dois nós.", "idea": "As cidades são nós; as estradas são arestas.", "use": "Navegação, redes informáticas e relações.", "cost": "BFS com listas de adjacência: O(V + E). Os contentores ordenados de C++ acrescentam custos logarítmicos.", "note": "Este grafo é não dirigido e não ponderado. BFS minimiza o número de arestas, não os quilómetros.", "exercise": "Para que serve seen? Qual é o caminho mínimo de A a E?", "answer": "seen evita visitas repetidas. A demonstração encontra A → C → E, com duas arestas.", "title": "Graph", "tag": "Uma rede de ligações", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"sub": "Encontrar valores por chave", "intro": "Uma função hash associa uma chave a um compartimento. Chaves diferentes podem partilhá-lo: é uma colisão.", "idea": "Como um registo consultado por nome, normalmente sem percorrer todas as entradas.", "use": "Pesquisas rápidas, caches e contagens.", "cost": "Pesquisa e inserção: O(1) em média; no pior caso podem ser O(n).", "note": "A demo soma códigos Unicode e aplica % 5. As bibliotecas usam outros métodos; C soma bytes destes nomes ASCII.", "exercise": "Guarde Bo e Ada. Porque não se substituem?", "answer": "Ambos chegam ao compartimento 2: 177 % 5 e 262 % 5. A cadeia conserva os dois pares.", "title": "Hash Table", "tag": "Encontrar valores por chave", "code": "student = {\n    \"name\": \"Ali\",\n    \"age\": 22,\n    \"city\": \"Roskilde\",\n}\n\nprint(student[\"name\"])  # Ali\nstudent[\"age\"] = 23     # Update\n\n# A simple teaching hash (not the internal dict hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}], "ar": [{"sub": "عناصر مرتبة بفهرس", "intro": "تخزن المصفوفة العناصر بترتيب محدد. يحدد الفهرس موضع العنصر، ويبدأ من 0.", "idea": "مثل خزائن مرقمة: يمكنك الوصول مباشرة إلى الخزانة رقم 2.", "use": "القياسات والصور وجداول البيانات.", "cost": "الوصول بالفهرس: O(1). الإدراج في البداية: O(n) بسبب إزاحة العناصر.", "note": "تستخدم Python قائمة ديناميكية، بينما يستخدم مثال C مصفوفة بسعة ثابتة.", "exercise": "ما فهرس القيمة 40؟ ماذا يحدث عند الإدراج في البداية؟", "answer": "فهرسها الأصلي 3. تتحرك جميع العناصر الموجودة موضعاً واحداً إلى الأمام.", "title": "Array", "tag": "عناصر مرتبة بفهرس", "code": "numbers = [10, 20, 30, 40]\nprint(numbers[2])       # 30\n\nnumbers.insert(0, 5)    # Insert at the front\nprint(numbers)         # [5, 10, 20, 30, 40]"}, {"sub": "سلسلة من العقد", "intro": "تحتوي كل عقدة على قيمة ومرجع للعقدة التالية. يبدأ المرور من head.", "idea": "مثل البحث عن كنز: كل إشارة تقود إلى الإشارة التالية.", "use": "السلاسل الديناميكية وتغيير الروابط.", "cost": "البحث عن موضع: O(n). الإدراج بعد عقدة معروفة: O(1).", "note": "تنتهي القائمة أحادية الربط بمرجع فارغ. لا يلزم أن تكون العقد متجاورة في الذاكرة.", "exercise": "كم عقدة نزور لإيجاد 30 في السلسلة الأصلية؟", "answer": "ثلاث عقد: 10 ثم 20 ثم 30. لا يوجد وصول مباشر بالفهرس.", "title": "Linked List", "tag": "سلسلة من العقد", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    no tro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"sub": "روابط کا جال", "intro": "گراف نوڈز اور کناروں سے بنتا ہے۔ اس میں چکر اور دو نوڈز کے درمیان کئی راستے ہو سکتے ہیں۔", "idea": "شہر نوڈ ہیں اور سڑکیں کنارے ہیں۔", "use": "راستہ تلاش کرنا، کمپیوٹر نیٹ ورک اور تعلقات۔", "cost": "پڑوسی فہرستوں کے ساتھ BFS: O(V + E)۔ C++ کے مرتب کنٹینرز اضافی logarithmic لاگت رکھتے ہیں۔", "note": "یہ گراف غیر سمتی اور بغیر وزن ہے۔ BFS کناروں کی تعداد کم کرتا ہے، کلومیٹر نہیں۔", "exercise": "seen کیوں ضروری ہے؟ A سے E کا مختصر ترین راستہ کیا ہے؟", "answer": "seen بار بار دورے سے بچاتا ہے۔ مثال میں A → C → E، یعنی دو کنارے ہیں۔", "title": "Graph", "tag": "روابط کا جال", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"sub": "کلید سے قدر تلاش کرنا", "intro": "ہیش فنکشن کلید کو ایک خانے میں بھیجتا ہے۔ دو مختلف کلیدیں ایک ہی خانے میں پہنچیں تو تصادم ہوتا ہے۔", "idea": "رجسٹر میں نام سے تلاش کرنے کی طرح، عموماً ہر اندراج دیکھنے کی ضرورت نہیں۔", "use": "تیز تلاش، کیش اور گنتی۔", "cost": "اوسط تلاش اور اضافہ O(1)؛ بدترین صورت میں O(n) ہو سکتا ہے۔", "note": "مثال Unicode قدروں کا مجموعہ لے کر % 5 کرتی ہے۔ لائبریریاں مختلف طریقے اور C یہاں ASCII ناموں کے بائٹس استعمال کرتا ہے۔", "exercise": "Bo اور Ada محفوظ کریں۔ دونوں کیوں باقی رہتے ہیں؟", "answer": "دونوں خانہ 2 میں پہنچتے ہیں: 177 % 5 اور 262 % 5۔ زنجیر دونوں جوڑے محفوظ رکھتی ہے۔", "title": "Hash Table", "tag": "کلید سے قدر تلاش کرنا", "code": "student = {\n    \"name\": \"Ali\",\n    \"age\": 22,\n    \"city\": \"Roskilde\",\n}\n\nprint(student[\"name\"])  # Ali\nstudent[\"age\"] = 23     # Update\n\n# A simple teaching hash (not the internal dict hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}], "hi": [{"sub": "इंडेक्स वाली क्रमबद्ध पंक्ति", "intro": "ऐरे तत्वों को क्रम में रखता है। इंडेक्स किसी तत्व का स्थान बताता है और 0 से शुरू होता है।", "idea": "नंबर वाले लॉकर की तरह: आप सीधे लॉकर 2 खोल सकते हैं।", "use": "माप, पिक्सेल और डेटा तालिकाएँ।", "cost": "इंडेक्स से पहुँच: O(1)। शुरुआत में जोड़ना: O(n), क्योंकि तत्व खिसकते हैं।", "note": "Python में गतिशील सूची है; C के उदाहरण में ऐरे की क्षमता तय है।", "exercise": "40 किस इंडेक्स पर है? शुरुआत में जोड़ने पर क्या बदलता है?", "answer": "पहले इंडेक्स 3 पर। सभी मौजूदा तत्व एक स्थान आगे जाते हैं।", "title": "Array", "tag": "इंडेक्स वाली क्रमबद्ध पंक्ति", "code": "numbers = [10, 20, 30, 40]\nprint(numbers[2])       # 30\n\nnumbers.insert(0, 5)    # Insert at the front\nprint(numbers)         # [5, 10, 20, 30, 40]"}, {"sub": "नोड की जुड़ी हुई शृंखला", "intro": "हर नोड में एक मान और अगले नोड का संदर्भ होता है। traversal head से शुरू होता है।", "idea": "खजाने की खोज की तरह: हर सुराग अगले सुराग तक पहुँचाता है।", "use": "गतिशील शृंखलाएँ और लिंक बदलना।", "cost": "स्थान खोजना: O(n)। पहले से ज्ञात नोड के बाद जोड़ना: O(1)।", "note": "एकल लिंक्ड लिस्ट खाली संदर्भ पर समाप्त होती है। नोड का मेमोरी में साथ होना जरूरी नहीं।", "exercise": "मूल शृंखला में 30 खोजने के लिए कितने नोड देखने होंगे?", "answer": "तीन: 10, फिर 20, फिर 30। इंडेक्स से सीधी पहुँच नहीं है।", "title": "Linked List", "tag": "नोड की जुड़ी हुई शृंखला", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"sub": "अंत में आया, पहले निकला", "intro": "Push ऊपर तत्व जोड़ता है। Pop सबसे ऊपर का तत्व हटाता है। यह LIFO नियम है।", "idea": "प्लेटों के ढेर की तरह: अंतिम रखी प्लेट पहले उठाते हैं।", "use": "Undo, फ़ंक्शन कॉल और गहराई-प्रथम खोज।", "cost": "उचित कार्यान्वयन में Push और Pop: O(1)। Python append की amortized लागत O(1) है।", "note": "स्टैक पहुँच का नियम बताता है। हटाने से पहले खाली होने की जाँच करें।", "exercise": "रीसेट करें, फिर 40 और 50 जोड़ें। पहले क्या निकलेगा?", "answer": "पहले 50, फिर 40। अंतिम जोड़ा तत्व ऊपर होता है।", "title": "Stack", "tag": "अंत में आया, पहले निकला", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"sub": "पहले आया, पहले निकला", "intro": "Enqueue पीछे जोड़ता है। Dequeue आगे से हटाता है। यह FIFO नियम है।", "idea": "दुकान की कतार की तरह: पहले आने वाले की बारी पहले आती है।", "use": "प्रिंट कार्य, लंबित काम और चौड़ाई-प्रथम खोज।", "cost": "deque या circular buffer में जोड़ना और हटाना O(1) है।", "note": "चित्र तार्किक क्रम दिखाता है। circular buffer से हटाते समय सभी तत्व नहीं खिसकते।", "exercise": "रीसेट करके 40 जोड़ें। अगला Dequeue क्या हटाएगा?", "answer": "10, क्योंकि 40 आने से पहले वह सबसे आगे था।", "title": "Queue", "tag": "पहले आया, पहले निकला", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"sub": "पदानुक्रम में डेटा", "intro": "ट्री में चक्र नहीं होते। जड़ के अलावा हर नोड का ठीक एक parent होता है।", "idea": "Kursus मुख्य फ़ोल्डर है; Python और Robot उसके उपफ़ोल्डर हैं।", "use": "फ़ोल्डर, दस्तावेज़ और निर्णय वृक्ष।", "cost": "सभी नोड देखना O(n)। खोज हमेशा O(log n) नहीं होती; यह ट्री के प्रकार पर निर्भर है।", "note": "Preorder में पहले नोड, फिर बाएँ से दाएँ उसके बच्चे देखते हैं। फ़ाइलों के नाम नहीं बदलते।", "exercise": "Python के बाद कौन-सा नोड आता है?", "answer": "intro.py: Robot से पहले Python के बच्चों को देखते हैं।", "title": "Tree", "tag": "पदानुक्रम में डेटा", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"sub": "संबंधों का नेटवर्क", "intro": "ग्राफ में नोड और किनारे होते हैं। इसमें चक्र और दो नोड के बीच कई रास्ते हो सकते हैं।", "idea": "शहर नोड हैं और सड़कें किनारे हैं।", "use": "मार्ग खोजना, कंप्यूटर नेटवर्क और संबंध।", "cost": "Adjacency lists के साथ BFS: O(V + E)। C++ के क्रमबद्ध कंटेनर अतिरिक्त logarithmic लागत जोड़ते हैं।", "note": "यह ग्राफ दिशारहित और भाररहित है। BFS किनारों की संख्या घटाता है, किलोमीटर नहीं।", "exercise": "seen क्यों जरूरी है? A से E का सबसे छोटा मार्ग क्या है?", "answer": "seen दोबारा जाने से रोकता है। उदाहरण में A → C → E है, यानी दो किनारे।", "title": "Graph", "tag": "संबंधों का नेटवर्क", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"sub": "कुंजी से मान खोजना", "intro": "हैश फ़ंक्शन कुंजी को एक bucket देता है। अलग कुंजियाँ एक bucket में पहुँचें तो collision होता है।", "idea": "रजिस्टर में नाम से खोजने की तरह, सामान्यतः सभी प्रविष्टियाँ नहीं देखनी पड़तीं।", "use": "तेज खोज, कैश और गिनती।", "cost": "खोज और जोड़ना औसतन O(1); सबसे खराब स्थिति में O(n) हो सकता है।", "note": "डेमो Unicode मानों का योग लेकर % 5 करता है। लाइब्रेरी दूसरे तरीके और C यहाँ ASCII नामों के bytes इस्तेमाल करता है।", "exercise": "Bo और Ada सहेजें। दोनों क्यों बने रहते हैं?", "answer": "दोनों bucket 2 में जाते हैं: 177 % 5 और 262 % 5। शृंखला दोनों जोड़े रखती है।", "title": "Hash Table", "tag": "कुंजी से मान खोजना", "code": "student = {\n    \"name\": \"Ali\",\n    \"age\": 22,\n    \"city\": \"Roskilde\",\n}\n\nprint(student[\"name\"])  # Ali\nstudent[\"age\"] = 23     # Update\n\n# A simple teaching hash (not the internal dict hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}], "zh": [{"sub": "通过索引访问一行数据", "intro": "数组按顺序保存元素。索引表示元素的位置，从 0 开始。", "idea": "就像编号的储物柜：可以直接打开 2 号柜。", "use": "用于测量数据、像素和数据表。", "cost": "索引访问为 O(1)。在开头插入为 O(n)，因为需要移动已有元素。", "note": "Python 使用动态列表；这里的 C 示例使用固定容量数组。", "exercise": "40 的索引是多少？在开头插入后会怎样？", "answer": "最初是 3。所有已有元素都向后移动一个位置。", "title": "Array", "tag": "通过索引访问一行数据", "code": "numbers = [10, 20, 30, 40]\nprint(numbers[2])       # 30\n\nnumbers.insert(0, 5)    # Insert at the front\nprint(numbers)         # [5, 10, 20, 30, 40]"}, {"sub": "由节点组成的链", "intro": "每个节点保存一个值和指向下一个节点的引用。从 head 开始遍历。", "idea": "就像寻宝：每条线索指向下一条线索。", "use": "用于动态链条和修改节点连接。", "cost": "按位置查找为 O(n)。在已知节点后插入为 O(1)。", "note": "单向链表以空引用结束。节点在内存中不必相邻。", "exercise": "在初始链表中找到 30 需要访问几个节点？", "answer": "三个：10、20、30。链表不能像数组一样通过索引直接访问。", "title": "Linked List", "tag": "由节点组成的链", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"sub": "后进先出", "intro": "Push 在顶部添加元素。Pop 移除顶部元素。这就是 LIFO。", "idea": "就像一摞盘子：最后放上的盘子最先拿走。", "use": "用于撤销操作、函数调用和深度优先搜索。", "cost": "合适实现中的 Push 和 Pop 为 O(1)。Python append 的摊还复杂度为 O(1)。", "note": "栈规定的是访问规则。移除元素前应检查是否为空。", "exercise": "重置后依次加入 40 和 50。先移除什么？", "answer": "先 50，后 40。最后加入的元素位于顶部。", "title": "Stack", "tag": "后进先出", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"sub": "先进先出", "intro": "Enqueue 从队尾添加，Dequeue 从队首移除。这就是 FIFO。", "idea": "就像商店排队：先到的人先接受服务。", "use": "用于打印队列、任务处理和广度优先搜索。", "cost": "使用 deque 或循环缓冲区时，入队和出队都是 O(1)。", "note": "动画展示逻辑顺序。循环缓冲区出队时不需要移动所有元素。", "exercise": "重置并加入 40。下一次 Dequeue 移除什么？", "answer": "10，因为加入 40 之前它已经在队首。", "title": "Queue", "tag": "先进先出", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"sub": "用层级组织数据", "intro": "树没有环。在有根树中，除根以外的每个节点都有且只有一个父节点。", "idea": "Kursus 是根文件夹，Python 和 Robot 是子文件夹。", "use": "用于文件夹、文档结构和决策树。", "cost": "遍历所有节点为 O(n)。查找并非总是 O(log n)，具体取决于树的类型。", "note": "先序遍历先访问节点，再从左到右访问子节点。文件名保持不变。", "exercise": "访问 Python 后，接下来访问哪个节点？", "answer": "intro.py。先访问 Python 的子节点，再访问 Robot。", "title": "Tree", "tag": "用层级组织数据", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"sub": "由连接组成的网络", "intro": "图由节点和边组成。图中可以有环，也可以在两点之间存在多条路径。", "idea": "城市是节点，道路是边。", "use": "用于导航、计算机网络和关系建模。", "cost": "邻接表上的 BFS 为 O(V + E)。C++ 的有序容器会增加对数级查找开销。", "note": "这里的图无向且无权。BFS 找到边数最少的路径，而不是公里数最少的路径。", "exercise": "为什么需要 seen？A 到 E 的最短路径是什么？", "answer": "seen 防止重复访问。示例找到 A → C → E，共两条边。", "title": "Graph", "tag": "由连接组成的网络", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"sub": "用键查找值", "intro": "哈希函数把键映射到桶。不同的键可能进入同一个桶，这叫作冲突。", "idea": "像按姓名查询登记表，通常不必检查每条记录。", "use": "用于快速查找、缓存和计数。", "cost": "查找和插入平均为 O(1)，最坏情况下可能为 O(n)。", "note": "动画把 Unicode 码点求和后取模 % 5。库可能使用其他哈希；C 示例对这些 ASCII 名称的字节求和。", "exercise": "保存 Bo 和 Ada。为什么两者都能保留？", "answer": "两者都进入桶 2：177 % 5 和 262 % 5。桶中的链保存两个键值对。", "title": "Hash Table", "tag": "用键查找值", "code": "student = {\n    \"name\": \"Ali\",\n    \"age\": 22,\n    \"city\": \"Roskilde\",\n}\n\nprint(student[\"name\"])  # Ali\nstudent[\"age\"] = 23     # Update\n\n# A simple teaching hash (not the internal dict hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}]}, "questions": {"da": [["Hvad er tal[2], når tal = [10, 20, 30, 40]?", ["20", "30", "40"], 1, "Indeks starter ved 0: 0 → 10, 1 → 20, 2 → 30."], ["Hvad gemmer en node i en enkeltkædet liste?", ["Kun et indeks", "En værdi og en reference til næste node", "Alle de andre noder"], 1, "Referencen next forbinder noden med den næste."], ["Push 10, Push 20, Pop. Hvad returneres?", ["10", "20", "Begge værdier"], 1, "Stack følger LIFO. 20 blev lagt på sidst."], ["Enqueue 10, Enqueue 20, Dequeue. Hvad returneres?", ["10", "20", "Ingen værdi"], 0, "Queue følger FIFO. 10 kom først."], ["Hvad gælder i et rodfæstet træ?", ["Alle noder har to børn", "Der skal være en cykel", "Alle andre noder end roden har én forælder"], 2, "Et rodfæstet træ har et hierarki og ingen cykler."], ["Hvad finder BFS i en uvægtet graf?", ["Korteste rute målt i antal kanter", "Altid korteste afstand i kilometer", "Kun rodens børn"], 0, "BFS udforsker grafen lag for lag. Kilometer kræver afstandsoplysninger."], ["Hvad er en hashkollision?", ["To nøgler får samme hashplads", "En nøgle slettes", "En tabel er altid fuld"], 0, "Forskellige nøgler kan ramme samme plads, og implementeringen skal håndtere det."]], "en": [["What is numbers[2] when numbers = [10, 20, 30, 40]?", ["20", "30", "40"], 1, "Indices start at 0: 0 → 10, 1 → 20, 2 → 30."], ["What does a node in a singly linked list store?", ["Only an index", "A value and a reference to the next node", "All the other nodes"], 1, "The next reference links a node to the next node."], ["Push 10, Push 20, Pop. What is returned?", ["10", "20", "Both values"], 1, "A stack follows LIFO. 20 was added last."], ["Enqueue 10, Enqueue 20, Dequeue. What is returned?", ["10", "20", "No value"], 0, "A queue follows FIFO. 10 arrived first."], ["What is true of a rooted tree?", ["Every node has two children", "There must be a cycle", "Every node except the root has one parent"], 2, "A rooted tree is a hierarchy without cycles."], ["What does BFS find in an unweighted graph?", ["A shortest route in number of edges", "Always the shortest distance in kilometres", "Only the children of the root"], 0, "BFS explores the graph layer by layer. Kilometres require distance information."], ["What is a hash collision?", ["Two keys map to the same bucket", "A key is deleted", "A table is always full"], 0, "Different keys can reach the same bucket; the implementation must handle this."]], "es": [["¿Qué devuelve numbers[2] para [10,20,30,40]?", ["20", "30", "40"], 1, "Los índices empiezan en 0: el índice 2 contiene 30."], ["¿Qué contiene un nodo de una lista simplemente enlazada?", ["Solo un índice", "Un valor y una referencia al siguiente nodo", "Todos los demás nodos"], 1, "La referencia next conecta con el siguiente nodo."], ["Push 10, Push 20, Pop. ¿Qué devuelve?", ["10", "20", "Ambos"], 1, "LIFO: 20 fue el último en entrar."], ["Enqueue 10, Enqueue 20, Dequeue. ¿Qué devuelve?", ["10", "20", "Nada"], 0, "FIFO: 10 llegó primero."], ["¿Qué es cierto en un árbol con raíz?", ["Cada nodo tiene dos hijos", "Debe haber un ciclo", "Cada nodo salvo la raíz tiene un padre"], 2, "Un árbol tiene una jerarquía sin ciclos."], ["¿Qué encuentra BFS en un grafo sin pesos?", ["Una ruta mínima por número de aristas", "Siempre la menor distancia en kilómetros", "Solo los hijos de la raíz"], 0, "BFS explora el grafo por niveles."], ["¿Qué es una colisión hash?", ["Dos claves llegan al mismo contenedor", "Se elimina una clave", "La tabla siempre está llena"], 0, "La implementación debe manejar claves distintas en el mismo contenedor."]], "fr": [["Que vaut numbers[2] pour [10,20,30,40] ?", ["20", "30", "40"], 1, "Les indices commencent à 0 : l’indice 2 contient 30."], ["Que contient un nœud de liste simplement chaînée ?", ["Seulement un indice", "Une valeur et une référence au
