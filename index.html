:root{--ink:#152b40;--muted:#546578;--blue:#215ad7;--pale:#eaf0ff;--orange:#a9470d;--line:#d9e0e7;--paper:#f6f7f9;--green:#13734a;--shadow:0 12px 35px #18314f09}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 15px;font-weight:650}button:hover{border-color:var(--blue);background:var(--pale)}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #df7619;outline-offset:4px}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#1748b4;color:white}.shell{max-width:1580px;margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}aside{padding:30px 20px;border-right:1px solid var(--line);background:#fff;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:20px;font-weight:800;letter-spacing:-.6px}.brand span{color:var(--blue)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted)}.nav-label{margin:40px 12px 10px}nav{display:grid;gap:5px}nav button{text-align:left;border:0;background:none;display:flex;align-items:center;gap:12px;padding:11px 12px}nav button[aria-current=page]{background:var(--pale);color:var(--blue)}nav small{font:12px ui-monospace,monospace;opacity:.7}.sidebar-note{margin:32px 12px 18px;font-size:13px;color:var(--muted)}main{min-width:0;padding:27px 44px 40px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:31px}.offline{font-size:13px;color:var(--green)}.dot{display:inline-block;width:7px;height:7px;border-radius:100%;background:var(--green);margin-right:7px}.top-actions{display:flex;gap:8px}h1{font-size:clamp(30px,3.6vw,48px);line-height:1.15;letter-spacing:-1.8px;margin:12px 0 16px}h2{font-size:20px;line-height:1.3;margin:0 0 12px}p{margin:0 0 14px}.intro{max-width:800px;color:var(--muted);font-size:18px}.tag{font-size:12px;padding:5px 10px;border-radius:20px;background:var(--pale);color:var(--blue);font-weight:700;display:inline-block;margin-bottom:18px}.lab{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);margin-top:10px}.lab-head{padding:18px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line)}.lab-head h2{margin:0;font-size:17px}.legend{color:var(--muted);font-size:12px}.legend span{color:var(--orange);font-weight:700}.stage{min-height:280px;display:flex;align-items:center;justify-content:center;padding:25px;overflow:auto;background:radial-gradient(#dce3ed .8px,transparent .8px);background-size:17px 17px}.row{display:flex;gap:10px;align-items:center;justify-content:center;min-height:160px}.cell{width:70px;flex-shrink:0;text-align:center}.box{display:flex;align-items:center;justify-content:center;min-height:66px;border:2px solid #b7c9ee;background:#eff4ff;border-radius:11px;font:700 24px ui-monospace,monospace;transition:background .25s,border .25s,transform .25s;animation:enter .3s ease-out}.index{font:12px ui-monospace,monospace;color:var(--muted);padding-top:7px}.active .box,.box.active{background:#fff0dc;border-color:#d66c19;transform:translateY(-5px)}.visited .box{background:#e0f5e9;border-color:#3b9468}.arrow{font-size:24px;color:var(--muted)}.vertical{display:flex;flex-direction:column-reverse;gap:7px;border:2px solid #b9c7d8;border-top:0;border-radius:0 0 12px 12px;padding:12px;min-width:180px;min-height:200px;justify-content:flex-start}.vertical .box{min-height:42px;font-size:20px;position:relative}.pointer{position:absolute;left:calc(100% + 17px);font:700 13px system-ui;white-space:nowrap;color:var(--orange)}.empty{color:var(--muted);text-align:center;font-size:16px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:18px 24px;border-top:1px solid var(--line)}.controls label{font-size:13px;font-weight:700}.controls input{width:82px;padding:8px;border-radius:8px;border:1px solid #aebdcd;background:#fff}.controls input[type=text]{width:100px}.controls select{padding:8px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.message{background:#eef3fd;padding:15px 24px;color:#23477c;min-height:58px;font-size:15px;border-top:1px solid #dde6f6}.lower{display:grid;grid-template-columns:1fr 1.12fr;gap:20px;margin-top:22px}.card{padding:24px;background:white;border:1px solid var(--line);border-radius:14px}.card p{font-size:15px}.card .muted,.muted{color:var(--muted)}.code{margin:14px 0 0;padding:18px;background:#14283c;color:#e6efff;border-radius:10px;overflow:auto;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;white-space:pre}.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.code-head button{font-size:12px;padding:5px 10px}.exercise{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}details{margin-top:10px}summary{cursor:pointer;color:var(--blue);font-weight:650}details p{margin-top:9px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:25px;gap:12px}.progress{font-size:13px;color:var(--muted)}svg{max-width:100%;height:auto;display:block;min-width:400px}svg text{font:700 17px system-ui;fill:var(--ink)}svg .edge{stroke:#a1b4ce;stroke-width:3}svg .node circle,svg .node rect{fill:#edf3ff;stroke:#aac0e8;stroke-width:2;transition:fill .3s,stroke .3s}svg .seen circle,svg .seen rect{fill:#dff4e8;stroke:#4b956c}svg .current circle,svg .current rect{fill:#ffecd3;stroke:#c66713;stroke-width:3}.hash{width:100%;max-width:690px;display:grid;gap:9px}.bucket{display:flex;align-items:center;gap:14px;font-size:14px}.bucket>b{width:30px;text-align:center;color:var(--muted)}.bucket-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-height:45px;background:#f2f5fa;border:1px solid var(--line);border-radius:9px;flex:1;padding:7px 12px}.bucket.current .bucket-line{background:#fff0dc;border-color:#d66c19}.entry{padding:4px 9px;background:white;border:1px solid #b8c9e2;border-radius:6px;font-family:ui-monospace,monospace}.quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.question{margin:0;padding:23px;border:1px solid var(--line);border-radius:13px;background:white}.question legend{float:left;width:100%;font-weight:750;margin-bottom:15px}.question label{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:7px;cursor:pointer}.question label:hover{background:var(--pale)}.question input{margin-top:6px;accent-color:var(--blue)}.feedback{margin-top:10px;font-size:14px;color:var(--green)}.wrong{color:#a33223}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white;font-size:15px}td,th{text-align:left;vertical-align:top;padding:14px;border-bottom:1px solid var(--line)}th{background:#eaf0fb}.guide{max-width:850px}.guide li{margin-bottom:10px}.guide code{background:#e7edf7;padding:2px 6px;border-radius:4px}dialog{max-width:760px;width:calc(100% - 36px);border:1px solid var(--line);border-radius:18px;padding:30px;color:var(--ink)}dialog::backdrop{background:#0c1d35aa}.projector .shell{grid-template-columns:1fr}.projector aside,.projector .lower{display:none}.projector main{max-width:1450px;width:100%;margin:auto}.projector .stage{min-height:380px}.projector .message{font-size:21px}.projector .box{min-height:85px;font-size:30px}.projector .cell{width:85px}.projector .vertical .box{min-height:48px;font-size:24px}.projector .controls button{font-size:18px}.projector .intro{font-size:22px}.projector .topbar{margin-bottom:15px}@keyframes enter{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:1000px){.shell{grid-template-columns:195px 1fr}aside{padding:25px 12px}main{padding:25px}.lower{grid-template-columns:1fr}.legend{display:none}}@media(max-width:700px){.shell{display:block}aside{position:static;height:auto;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.nav-label,.sidebar-note{display:none}nav{display:flex;overflow:auto;margin-top:15px}nav button{white-space:nowrap;font-size:14px}nav small{display:none}main{padding:20px 14px}.topbar{align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:24px}.top-actions button{font-size:13px;padding:7px 10px}.stage{justify-content:flex-start;padding:20px;min-height:260px}.stage>div,.stage>svg{margin:auto}.cell{width:55px}.box{font-size:21px;min-height:55px}.row{gap:7px}.quiz-grid{grid-template-columns:1fr}.lab-head,.controls,.message{padding:15px}.card{padding:19px}.bottom button{font-size:13px}.projector .stage{min-height:300px}}@media print{aside,.topbar,.controls,.bottom,button,dialog{display:none!important}.shell{display:block}main{padding:0}.lab,.card{break-inside:avoid;box-shadow:none}.lower{display:block}.card{margin-top:12px}.code{white-space:pre-wrap}body{background:white}}

<script>
const DATA={"lessons": {"da": [{"title": "Array", "sub": "En række med adresser", "tag": "Indeks · Direkte adgang", "intro": "Et array organiserer elementer i en rækkefølge. Et indeks fortæller, hvilken plads vi vil læse. Det første indeks er 0.", "idea": "Tænk på nummererede skabe: Du kan gå direkte til skab 2 uden først at åbne skab 0 og 1.", "use": "Bruges til f.eks. måledata, pixelværdier og tabeller med en fast struktur.", "cost": "Opslag via indeks: O(1). Indsættelse midt i et sammenhængende array: O(n), fordi efterfølgende elementer flyttes.", "note": "Python bruger en list: et dynamisk array af referencer. C-eksemplet bruger et fast, typet array; vi holder separat styr på antallet af elementer.", "exercise": "Hvilket indeks skal du bruge for at læse tallet 40? Hvad sker der med indeksene efter indsættelse forrest?", "answer": "40 ligger først på indeks 3. Ved indsættelse forrest flyttes alle eksisterende elementer én plads mod højre.", "code": "tal = [10, 20, 30, 40]\nprint(tal[2])       # 30\n\ntal.insert(0, 5)    # Indsæt forrest\nprint(tal)         # [5, 10, 20, 30, 40]"}, {"title": "Linked List", "sub": "En kæde af noder", "tag": "Noder · Referencer", "intro": "Hver node gemmer en værdi og en reference til den næste node. Vi starter ved head og følger referencerne gennem kæden.", "idea": "Tænk på en skattejagt: Hver seddel fortæller, hvor den næste ligger. Du kan ikke springe direkte til seddel nummer fire.", "use": "Bruges, når man vil forbinde noder og kunne ændre kæden uden at flytte alle værdier i hukommelsen.", "cost": "Opslag på en position: O(n). Indsættelse lige efter en allerede kendt node: O(1). At finde noden kan tage O(n).", "note": "Tegningen viser en enkeltkædet liste. Noderne behøver ikke ligge ved siden af hinanden i hukommelsen. C-eksemplet bruger lokale noder og pointere; NULL markerer slutningen.", "exercise": "Hvor mange noder besøger du for at finde 30 i den oprindelige kæde?", "answer": "Tre: 10, derefter 20, derefter 30. En linked list har ikke arrays direkte opslag via indeks.", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"title": "Stack", "sub": "Sidste ind. Første ud.", "tag": "LIFO · Last In, First Out", "intro": "En stak har én ende, som vi bruger: toppen. Push lægger noget på toppen. Pop fjerner det øverste element.", "idea": "Tænk på en stak tallerkener. Den tallerken, du lægger øverst, er den næste, du tager.", "use": "Bruges til undo-funktioner, dybdesøgning og til at holde styr på funktionskald.", "cost": "Push og pop: normalt O(1). For Pythons list er append amortiseret O(1), og pop fra slutningen er O(1).", "note": "LIFO beskriver adfærden. En stack kan implementeres med forskellige underliggende datastrukturer. C-eksemplet kontrollerer både kapacitet og tom stak.", "exercise": "Tryk Nulstil. Tilføj 40 og derefter 50. Hvilke to tal fjernes først?", "answer": "50 fjernes først, derefter 40. Den senest tilføjede værdi ligger øverst.", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"title": "Queue", "sub": "Første ind. Første ud.", "tag": "FIFO · First In, First Out", "intro": "En kø får nye elementer bagest og fjerner elementer forrest. Den, der har ventet længst, kommer først til.", "idea": "Tænk på køen ved kassen. Nye kunder stiller sig bagest, og den forreste kunde bliver betjent først.", "use": "Bruges til printerkøer, opgavebehandling og breddesøgning i grafer.", "cost": "Enqueue og dequeue: O(1) med f.eks. collections.deque. At fjerne forrest i en Python-list tager derimod O(n).", "note": "Visualiseringen viser den logiske rækkefølge. En effektiv kø behøver ikke flytte alle elementer, når den fjerner det forreste. C-eksemplet bruger en cirkulær buffer.", "exercise": "Tryk Nulstil. Tilføj 40. Hvilket tal fjernes ved det næste Dequeue?", "answer": "10. Det stod allerede forrest, før 40 blev tilføjet bagest.", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"title": "Tree", "sub": "Data i et hierarki", "tag": "Rod · Forælder · Barn", "intro": "Et træ forbinder noder i et hierarki uden cykler. I et rodfæstet træ har hver node, undtagen roden, præcis én forælder.", "idea": "Tænk på mapper: Kursus er roden. Python og Robot er undermapper. De nederste noder er blade.", "use": "Bruges til mappehierarkier, dokumentstrukturer, beslutningstræer og søgetræer.", "cost": "At gennemløbe alle noder: O(n). Opslag er ikke automatisk O(log n); det kræver f.eks. et balanceret søgetræ.", "note": "Vi viser preorder: Besøg først noden og derefter dens børn fra venstre mod højre. Dette er et almindeligt hierarki, ikke et binært søgetræ.", "exercise": "Hvilken node besøges efter Python ved denne preorder-gennemgang?", "answer": "intro.py. Vi besøger Pythons børn, før vi går videre til søskenden Robot.", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"title": "Graph", "sub": "Et netværk af forbindelser", "tag": "Noder · Kanter · Mulige cykler", "intro": "En graf består af noder og kanter. Den kan beskrive et netværk, hvor der er flere veje mellem to steder.", "idea": "Tænk på byer forbundet med veje. Noder er byer, og kanter er veje. Her tæller vi antal forbindelser, ikke kilometer.", "use": "Bruges til navigation, computernetværk, sociale relationer og afhængigheder.", "cost": "Breddesøgning (BFS) med nabolister: O(V + E), hvor V er antal noder, og E er antal kanter.", "note": "Denne graf er urettet og uvægtet. BFS finder korteste afstand målt i antal kanter. Vægtede veje kræver en passende anden algoritme. Begge kodeeksempler bruger nabolister.", "exercise": "Hvorfor har vi brug for et seen-sæt? Hvilken korteste rute finder demoen fra A til E?", "answer": "seen forhindrer gentagne besøg i cyklen. Demoen finder A → C → E, som har to kanter.", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"title": "Hash Table", "sub": "Find værdien med en nøgle", "tag": "Nøgle → Hash → Plads", "intro": "En hashfunktion omsætter en nøgle til en plads i en tabel. Flere nøgler kan ramme samme plads; det kaldes en kollision.", "idea": "Tænk på et register: Du slår op med et navn og får den tilhørende værdi, uden normalt at gennemgå hele registret.", "use": "Bruges til hurtige opslag, caches og optælling. Pythons dict er en hashbaseret struktur.", "cost": "Opslag og indsættelse: gennemsnitligt O(1) under passende betingelser. I værste fald kan de tage O(n).", "note": "Demoen bruger sum(ord(tegn)) % 5 og kæder i hver bucket. Det er en undervisningsmodel; Python dict bruger en anden hash- og kollisionsmekanisme. C-eksemplet hasher bytes; for demoens ASCII-navne svarer bucketnumrene til animationens.", "exercise": "Gem Bo og derefter Ada. Hvorfor kan begge ligge i bucket 2 uden at overskrive hinanden?", "answer": "De har forskellige nøgler, men samme hashplads: Bo → 177 % 5 = 2 og Ada → 262 % 5 = 2. Vi gemmer begge nøgle-værdi-par i bucketens kæde.", "code": "student = {\n    \"navn\": \"Ali\",\n    \"alder\": 22,\n    \"by\": \"Roskilde\",\n}\n\nprint(student[\"navn\"])  # Ali\nstudent[\"alder\"] = 23   # Opdater\n\n# Demoens simple hash (ikke dicts interne hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}], "en": [{"title": "Array", "sub": "A row with addresses", "tag": "Index · Direct access", "intro": "An array organises elements in a sequence. An index identifies the position we want to read. The first index is 0.", "idea": "Think of numbered lockers: you can go straight to locker 2 without opening lockers 0 and 1 first.", "use": "Useful for measurements, pixel values and tables with a fixed structure.", "cost": "Access by index: O(1). Inserting into the middle of a contiguous array: O(n), because later elements must move.", "note": "The Python example uses a list: a dynamic array of references. C uses a fixed-size, typed array here; we track the number of elements separately.", "exercise": "Which index reads the value 40? What happens to the existing indices when you insert at the front?", "answer": "Initially, 40 is at index 3. Inserting at the front shifts every existing element one position to the right.", "code": "numbers = [10, 20, 30, 40]\nprint(numbers[2])       # 30\n\nnumbers.insert(0, 5)    # Insert at the front\nprint(numbers)         # [5, 10, 20, 30, 40]"}, {"title": "Linked List", "sub": "A chain of nodes", "tag": "Nodes · References", "intro": "Each node stores a value and a reference to the next node. Start at head and follow the references through the chain.", "idea": "Think of a treasure hunt: each clue tells you where the next clue is. You cannot jump directly to the fourth clue.", "use": "Useful for connecting nodes and changing links without moving all the values in memory.", "cost": "Access by position: O(n). Inserting after a node you already have: O(1). Finding that node can take O(n).", "note": "This is a singly linked list. Nodes need not be adjacent in memory. The C example uses local nodes and pointers; NULL marks the end.", "exercise": "How many nodes do you visit to find 30 in the original chain?", "answer": "Three: 10, then 20, then 30. A linked list does not support the direct index access of an array.", "code": "class Node:\n    def __init__(self, value, next=None):\n        self.value = value\n        self.next = next\n\nhead = Node(10, Node(20, Node(30)))\nnode = head\nwhile node is not None:\n    print(node.value)\n    node = node.next"}, {"title": "Stack", "sub": "Last in. First out.", "tag": "LIFO · Last In, First Out", "intro": "A stack has one end that we use: the top. Push adds an element to the top. Pop removes the top element.", "idea": "Think of a stack of plates. The plate you put on top is the next one you take.", "use": "Used for undo operations, depth-first search and tracking function calls.", "cost": "Push and pop: normally O(1). Python list.append is amortised O(1), and pop from the end is O(1).", "note": "LIFO describes behaviour. A stack can use different underlying structures. The C example checks both capacity and an empty stack.", "exercise": "Reset. Push 40 and then 50. Which two values are removed first?", "answer": "50 is removed first, then 40. The most recently added value is on top.", "code": "stack = [10, 20, 30]\nstack.append(40)    # Push\nstack.append(50)    # Push\n\nprint(stack.pop())  # 50\nprint(stack.pop())  # 40"}, {"title": "Queue", "sub": "First in. First out.", "tag": "FIFO · First In, First Out", "intro": "A queue adds new elements at the back and removes elements from the front. The element waiting longest is served first.", "idea": "Think of a checkout queue. New customers join at the back; the customer at the front is served first.", "use": "Used for print queues, task processing and breadth-first search in graphs.", "cost": "Enqueue and dequeue: O(1) with collections.deque or a circular buffer. Removing the first item from a Python list takes O(n).", "note": "The animation shows the logical order. The C example uses a circular buffer, so removing an item does not shift all the other items.", "exercise": "Reset and enqueue 40. Which value will the next Dequeue remove?", "answer": "10. It was already at the front before 40 was added at the back.", "code": "from collections import deque\n\nqueue = deque([10, 20, 30])\nqueue.append(40)        # Enqueue\n\nprint(queue.popleft()) # 10\nprint(list(queue))     # [20, 30, 40]"}, {"title": "Tree", "sub": "Data in a hierarchy", "tag": "Root · Parent · Child", "intro": "A tree connects nodes in a hierarchy without cycles. In a rooted tree, every node except the root has exactly one parent.", "idea": "Think of folders: Kursus is the root. Python and Robot are subfolders. The bottom nodes are leaves.", "use": "Used for folder hierarchies, document structures, decision trees and search trees.", "cost": "Traversing every node: O(n). Lookup is not automatically O(log n); that requires a structure such as a balanced search tree.", "note": "We show preorder: visit the node, then its children from left to right. This is a general hierarchy, not a binary search tree. The sample folder names stay unchanged in both languages.", "exercise": "Which node is visited after Python in this preorder traversal?", "answer": "intro.py. We visit the children of Python before moving on to its sibling Robot.", "code": "tree = {\n    \"Kursus\": [\"Python\", \"Robot\"],\n    \"Python\": [\"intro.py\", \"agent.py\"],\n    \"Robot\": [\"sensor.py\"],\n}\n\ndef visit(node):\n    print(node)\n    for child in tree.get(node, []):\n        visit(child)\n\nvisit(\"Kursus\")"}, {"title": "Graph", "sub": "A network of connections", "tag": "Nodes · Edges · Possible cycles", "intro": "A graph consists of nodes and edges. It can model a network with several routes between two places.", "idea": "Think of cities connected by roads. Nodes are cities and edges are roads. Here we count connections, not kilometres.", "use": "Used for navigation, computer networks, social relationships and dependencies.", "cost": "Breadth-first search (BFS) using adjacency lists: O(V + E), where V is the number of nodes and E the number of edges.", "note": "This graph is undirected and unweighted. BFS finds the shortest distance in number of edges. Weighted roads need a suitable different algorithm. Both code examples use adjacency lists.", "exercise": "Why do we need a seen set? Which shortest route does this demo find from A to E?", "answer": "seen prevents repeated visits around a cycle. The demo finds A → C → E, which has two edges.", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"A\", \"D\"],\n         \"C\": [\"A\", \"D\", \"E\"],\n         \"D\": [\"B\", \"C\", \"E\"], \"E\": [\"C\", \"D\"]}\nqueue, seen = deque([\"A\"]), {\"A\"}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for neighbor in graph[node]:\n        if neighbor not in seen:\n            seen.add(neighbor)\n            queue.append(neighbor)"}, {"title": "Hash Table", "sub": "Find a value using its key", "tag": "Key → Hash → Bucket", "intro": "A hash function maps a key to a bucket in a table. Different keys can reach the same bucket; this is called a collision.", "idea": "Think of a register: look up a name to get its value, usually without searching the entire register.", "use": "Used for fast lookups, caches and counting. Python dict is a hash-based structure.", "cost": "Lookup and insertion: O(1) on average under suitable conditions. In the worst case they can take O(n).", "note": "The animation uses sum(ord(character)) % 5 and bucket chains. Python dict uses different hashing and collision handling. The C example hashes bytes; for the ASCII names used here the bucket numbers match the animation.", "exercise": "Store Bo and then Ada. Why can both stay in bucket 2 without overwriting each other?", "answer": "The keys differ but share a bucket: Bo → 177 % 5 = 2 and Ada → 262 % 5 = 2. We keep both key–value pairs in the bucket chain.", "code": "student = {\n    \"name\": \"Ali\",\n    \"age\": 22,\n    \"city\": \"Roskilde\",\n}\n\nprint(student[\"name\"])  # Ali\nstudent[\"age\"] = 23     # Update\n\n# A simple teaching hash (not the internal dict hash):\ndef demo_hash(key):\n    return sum(ord(c) for c in key) % 5"}]}, "questions": {"da": [["Hvad er tal[2], når tal = [10, 20, 30, 40]?", ["20", "30", "40"], 1, "Indeks starter ved 0: 0 → 10, 1 → 20, 2 → 30."], ["Hvad gemmer en node i en enkeltkædet liste?", ["Kun et indeks", "En værdi og en reference til næste node", "Alle de andre noder"], 1, "Referencen next forbinder noden med den næste."], ["Push 10, Push 20, Pop. Hvad returneres?", ["10", "20", "Begge værdier"], 1, "Stack følger LIFO. 20 blev lagt på sidst."], ["Enqueue 10, Enqueue 20, Dequeue. Hvad returneres?", ["10", "20", "Ingen værdi"], 0, "Queue følger FIFO. 10 kom først."], ["Hvad gælder i et rodfæstet træ?", ["Alle noder har to børn", "Der skal være en cykel", "Alle andre noder end roden har én forælder"], 2, "Et rodfæstet træ har et hierarki og ingen cykler."], ["Hvad finder BFS i en uvægtet graf?", ["Korteste rute målt i antal kanter", "Altid korteste afstand i kilometer", "Kun rodens børn"], 0, "BFS udforsker grafen lag for lag. Kilometer kræver afstandsoplysninger."], ["Hvad er en hashkollision?", ["To nøgler får samme hashplads", "En nøgle slettes", "En tabel er altid fuld"], 0, "Forskellige nøgler kan ramme samme plads, og implementeringen skal håndtere det."]], "en": [["What is numbers[2] when numbers = [10, 20, 30, 40]?", ["20", "30", "40"], 1, "Indices start at 0: 0 → 10, 1 → 20, 2 → 30."], ["What does a node in a singly linked list store?", ["Only an index", "A value and a reference to the next node", "All the other nodes"], 1, "The next reference links a node to the next node."], ["Push 10, Push 20, Pop. What is returned?", ["10", "20", "Both values"], 1, "A stack follows LIFO. 20 was added last."], ["Enqueue 10, Enqueue 20, Dequeue. What is returned?", ["10", "20", "No value"], 0, "A queue follows FIFO. 10 arrived first."], ["What is true of a rooted tree?", ["Every node has two children", "There must be a cycle", "Every node except the root has one parent"], 2, "A rooted tree is a hierarchy without cycles."], ["What does BFS find in an unweighted graph?", ["A shortest route in number of edges", "Always the shortest distance in kilometres", "Only the children of the root"], 0, "BFS explores the graph layer by layer. Kilometres require distance information."], ["What is a hash collision?", ["Two keys map to the same bucket", "A key is deleted", "A table is always full"], 0, "Different keys can reach the same bucket; the implementation must handle this."]]}, "c": {"da": ["#include <stdio.h>\n\nint main(void) {\n    int numbers[8] = {10, 20, 30, 40};\n    size_t count = 4;\n    const size_t capacity = sizeof numbers / sizeof numbers[0];\n    printf(\"%d\\n\", numbers[2]);  // 30\n\n    // Gør plads forrest; kontrollér kapaciteten først.\n    if (count == capacity) return 1;\n    for (size_t i = count; i > 0; --i)\n        numbers[i] = numbers[i - 1];\n    numbers[0] = 5;\n    ++count;\n    for (size_t i = 0; i < count; ++i)\n        printf(\"%d%s\", numbers[i], i + 1 == count ? \"\\n\" : \" \");\n    return 0;\n}", "#include <stdio.h>\n\ntypedef struct Node {\n    int value;\n    struct Node *next;\n} Node;\n\nint main(void) {\n    // Lokale noder eksisterer, indtil main returnerer.\n    Node third = {30, NULL};\n    Node second = {20, &third};\n    Node first = {10, &second};\n    Node fourth = {40, NULL};\n    third.next = &fourth;  // Tilføj efter en kendt node.\n\n    for (const Node *node = &first; node != NULL; node = node->next)\n        printf(\"%d\\n\", node->value);\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define CAPACITY 8\n\ntypedef struct {\n    int values[CAPACITY];\n    size_t count;\n} Stack;\n\nbool push(Stack *s, int value) {\n    if (s->count == CAPACITY) return false;\n    s->values[s->count++] = value;\n    return true;\n}\n\nbool pop(Stack *s, int *out) {\n    if (s->count == 0) return false;\n    *out = s->values[--s->count];\n    return true;\n}\n\nint main(void) {\n    Stack s = {{10, 20, 30}, 3};\n    int value;\n    if (!push(&s, 40) || !push(&s, 50)) return 1;\n    if (pop(&s, &value)) printf(\"%d\\n\", value);  // 50\n    if (pop(&s, &value)) printf(\"%d\\n\", value);  // 40\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define CAPACITY 8\n\ntypedef struct {\n    int values[CAPACITY];\n    size_t front, count;\n} Queue;\n\nbool enqueue(Queue *q, int value) {\n    if (q->count == CAPACITY) return false;\n    // Gå tilbage til starten uden at flytte de eksisterende elementer.\n    size_t back = (q->front + q->count) % CAPACITY;\n    q->values[back] = value;\n    ++q->count;\n    return true;\n}\n\nbool dequeue(Queue *q, int *out) {\n    if (q->count == 0) return false;\n    *out = q->values[q->front];\n    q->front = (q->front + 1) % CAPACITY;\n    --q->count;\n    return true;\n}\n\nint main(void) {\n    Queue q = {{0}, 0, 0};\n    for (int value = 10; value <= 40; value += 10)\n        if (!enqueue(&q, value)) return 1;\n    int value;\n    while (dequeue(&q, &value)) printf(\"%d\\n\", value);\n    return 0;\n}", "#include <stddef.h>\n#include <stdio.h>\n\ntypedef struct Node {\n    const char *name;\n    const struct Node *children[2];\n    size_t child_count;\n} Node;\n\nvoid visit(const Node *node) {\n    if (node == NULL) return;\n    puts(node->name);  // Preorder: forælder før børn.\n    for (size_t i = 0; i < node->child_count; ++i)\n        visit(node->children[i]);\n}\n\nint main(void) {\n    const Node intro = {\"intro.py\", {NULL, NULL}, 0};\n    const Node agent = {\"agent.py\", {NULL, NULL}, 0};\n    const Node sensor = {\"sensor.py\", {NULL, NULL}, 0};\n    const Node python = {\"Python\", {&intro, &agent}, 2};\n    const Node robot = {\"Robot\", {&sensor, NULL}, 1};\n    const Node root = {\"Kursus\", {&python, &robot}, 2};\n    visit(&root);\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define V 5\n\nint main(void) {\n    // A=0, B=1, C=2, D=3, E=4. -1 markerer en ubrugt plads.\n    const int graph[V][3] = {\n        {1, 2, -1}, {0, 3, -1}, {0, 3, 4},\n        {1, 2, 4}, {2, 3, -1}\n    };\n    int queue[V], front = 0, back = 0;\n    bool seen[V] = {false};\n    seen[0] = true;\n    queue[back++] = 0;\n\n    while (front < back) {\n        int node = queue[front++];\n        printf(\"%c\\n\", 'A' + node);\n        for (int i = 0; i < 3 && graph[node][i] != -1; ++i) {\n            int neighbor = graph[node][i];\n            if (!seen[neighbor]) {\n                // Markér ved enqueue: hver node kommer kun i køen én gang.\n                seen[neighbor] = true;\n                queue[back++] = neighbor;\n            }\n        }\n    }\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#include <string.h>\n#define BUCKETS 5\n#define MAX_ENTRIES 10\n\ntypedef struct Entry {\n    const char *key;\n    int value;\n    struct Entry *next;\n} Entry;\n\ntypedef struct {\n    Entry *buckets[BUCKETS];\n    Entry entries[MAX_ENTRIES];\n    size_t used;\n} Table;\n\nunsigned hash(const char *key) {\n    unsigned result = 0;\n    while (*key != '\\0')\n        result = (result + (unsigned char)*key++) % BUCKETS;\n    return result;\n}\n\nEntry *find(Table *t, const char *key) {\n    for (Entry *e = t->buckets[hash(key)]; e != NULL; e = e->next)\n        if (strcmp(e->key, key) == 0) return e;\n    return NULL;\n}\n\nbool put(Table *t, const char *key, int value) {\n    Entry *existing = find(t, key);\n    if (existing != NULL) {\n        existing->value = value;\n        return true;\n    }\n    if (t->used == MAX_ENTRIES) return false;\n    unsigned bucket = hash(key);\n    Entry *e = &t->entries[t->used++];\n    // Nøgler skal leve længere end tabellen; her bruges strengliteraler.\n    *e = (Entry){key, value, t->buckets[bucket]};\n    t->buckets[bucket] = e;\n    return true;\n}\n\nint main(void) {\n    Table table = {0};\n    if (!put(&table, \"Bo\", 24) || !put(&table, \"Ada\", 25)) return 1;\n    printf(\"Bo: %u, Ada: %u\\n\", hash(\"Bo\"), hash(\"Ada\"));\n    // Begge nøgler har bucket 2 og bevares i kæden.\n    for (Entry *e = table.buckets[2]; e != NULL; e = e->next)\n        printf(\"%s: %d\\n\", e->key, e->value);\n    return 0;\n}"], "en": ["#include <stdio.h>\n\nint main(void) {\n    int numbers[8] = {10, 20, 30, 40};\n    size_t count = 4;\n    const size_t capacity = sizeof numbers / sizeof numbers[0];\n    printf(\"%d\\n\", numbers[2]);  // 30\n\n    // Make room at the front; check capacity first.\n    if (count == capacity) return 1;\n    for (size_t i = count; i > 0; --i)\n        numbers[i] = numbers[i - 1];\n    numbers[0] = 5;\n    ++count;\n    for (size_t i = 0; i < count; ++i)\n        printf(\"%d%s\", numbers[i], i + 1 == count ? \"\\n\" : \" \");\n    return 0;\n}", "#include <stdio.h>\n\ntypedef struct Node {\n    int value;\n    struct Node *next;\n} Node;\n\nint main(void) {\n    // Local nodes stay alive until main returns.\n    Node third = {30, NULL};\n    Node second = {20, &third};\n    Node first = {10, &second};\n    Node fourth = {40, NULL};\n    third.next = &fourth;  // Append after a known node.\n\n    for (const Node *node = &first; node != NULL; node = node->next)\n        printf(\"%d\\n\", node->value);\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define CAPACITY 8\n\ntypedef struct {\n    int values[CAPACITY];\n    size_t count;\n} Stack;\n\nbool push(Stack *s, int value) {\n    if (s->count == CAPACITY) return false;\n    s->values[s->count++] = value;\n    return true;\n}\n\nbool pop(Stack *s, int *out) {\n    if (s->count == 0) return false;\n    *out = s->values[--s->count];\n    return true;\n}\n\nint main(void) {\n    Stack s = {{10, 20, 30}, 3};\n    int value;\n    if (!push(&s, 40) || !push(&s, 50)) return 1;\n    if (pop(&s, &value)) printf(\"%d\\n\", value);  // 50\n    if (pop(&s, &value)) printf(\"%d\\n\", value);  // 40\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define CAPACITY 8\n\ntypedef struct {\n    int values[CAPACITY];\n    size_t front, count;\n} Queue;\n\nbool enqueue(Queue *q, int value) {\n    if (q->count == CAPACITY) return false;\n    // Wrap around instead of moving existing elements.\n    size_t back = (q->front + q->count) % CAPACITY;\n    q->values[back] = value;\n    ++q->count;\n    return true;\n}\n\nbool dequeue(Queue *q, int *out) {\n    if (q->count == 0) return false;\n    *out = q->values[q->front];\n    q->front = (q->front + 1) % CAPACITY;\n    --q->count;\n    return true;\n}\n\nint main(void) {\n    Queue q = {{0}, 0, 0};\n    for (int value = 10; value <= 40; value += 10)\n        if (!enqueue(&q, value)) return 1;\n    int value;\n    while (dequeue(&q, &value)) printf(\"%d\\n\", value);\n    return 0;\n}", "#include <stddef.h>\n#include <stdio.h>\n\ntypedef struct Node {\n    const char *name;\n    const struct Node *children[2];\n    size_t child_count;\n} Node;\n\nvoid visit(const Node *node) {\n    if (node == NULL) return;\n    puts(node->name);  // Preorder: parent before children.\n    for (size_t i = 0; i < node->child_count; ++i)\n        visit(node->children[i]);\n}\n\nint main(void) {\n    const Node intro = {\"intro.py\", {NULL, NULL}, 0};\n    const Node agent = {\"agent.py\", {NULL, NULL}, 0};\n    const Node sensor = {\"sensor.py\", {NULL, NULL}, 0};\n    const Node python = {\"Python\", {&intro, &agent}, 2};\n    const Node robot = {\"Robot\", {&sensor, NULL}, 1};\n    const Node root = {\"Kursus\", {&python, &robot}, 2};\n    visit(&root);\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#define V 5\n\nint main(void) {\n    // A=0, B=1, C=2, D=3, E=4. -1 marks an unused slot.\n    const int graph[V][3] = {\n        {1, 2, -1}, {0, 3, -1}, {0, 3, 4},\n        {1, 2, 4}, {2, 3, -1}\n    };\n    int queue[V], front = 0, back = 0;\n    bool seen[V] = {false};\n    seen[0] = true;\n    queue[back++] = 0;\n\n    while (front < back) {\n        int node = queue[front++];\n        printf(\"%c\\n\", 'A' + node);\n        for (int i = 0; i < 3 && graph[node][i] != -1; ++i) {\n            int neighbor = graph[node][i];\n            if (!seen[neighbor]) {\n                // Mark on enqueue: each node enters the queue once.\n                seen[neighbor] = true;\n                queue[back++] = neighbor;\n            }\n        }\n    }\n    return 0;\n}", "#include <stdbool.h>\n#include <stdio.h>\n#include <string.h>\n#define BUCKETS 5\n#define MAX_ENTRIES 10\n\ntypedef struct Entry {\n    const char *key;\n    int value;\n    struct Entry *next;\n} Entry;\n\ntypedef struct {\n    Entry *buckets[BUCKETS];\n    Entry entries[MAX_ENTRIES];\n    size_t used;\n} Table;\n\nunsigned hash(const char *key) {\n    unsigned result = 0;\n    while (*key != '\\0')\n        result = (result + (unsigned char)*key++) % BUCKETS;\n    return result;\n}\n\nEntry *find(Table *t, const char *key) {\n    for (Entry *e = t->buckets[hash(key)]; e != NULL; e = e->next)\n        if (strcmp(e->key, key) == 0) return e;\n    return NULL;\n}\n\nbool put(Table *t, const char *key, int value) {\n    Entry *existing = find(t, key);\n    if (existing != NULL) {\n        existing->value = value;\n        return true;\n    }\n    if (t->used == MAX_ENTRIES) return false;\n    unsigned bucket = hash(key);\n    Entry *e = &t->entries[t->used++];\n    // Keys must outlive the table; literals do in this example.\n    *e = (Entry){key, value, t->buckets[bucket]};\n    t->buckets[bucket] = e;\n    return true;\n}\n\nint main(void) {\n    Table table = {0};\n    if (!put(&table, \"Bo\", 24) || !put(&table, \"Ada\", 25)) return 1;\n    printf(\"Bo: %u, Ada: %u\\n\", hash(\"Bo\"), hash(\"Ada\"));\n    // Both keys have bucket 2 and remain in the chain.\n    for (Entry *e = table.buckets[2]; e != NULL; e = e->next)\n        printf(\"%s: %d\\n\", e->key, e->value);\n    return 0;\n}"]}};

 $('content').innerHTML=`<div class="eyebrow">${t('Overblik / Vælg efter opgaven','Overview / Choose for the task')}</div><h1>${t('Samme data. Forskellig adfærd.','Same data. Different behaviour.')}</h1><p class="intro">${t('Valget af datastruktur påvirker, hvilke handlinger der er enkle og effektive.','Your choice of data structure determines which operations are simple and efficient.')}</p><div class="table-wrap card" style="padding:0"><table><thead><tr>${(language==='da'?['Struktur','Organisering','Huskeregel','Anvendelse','Typisk tid']:['Structure','Organisation','Key idea','Use','Typical time']).map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table></div><div class="lower"><section class="card"><h2>${t('Hvad betyder O(...)?','What does O(...) mean?')}</h2><p><strong>O(1):</strong> ${t('Arbejdet vokser ikke med antallet af elementer.','The work does not grow with the number of elements.')}</p><p><strong>O(n):</strong> ${t('Arbejdet kan vokse proportionalt med antallet af elementer.','The work can grow in proportion to the number of elements.')}</p><p><strong>O(V + E):</strong> ${t('Arbejdet afhænger af både noder og kanter.','The work depends on both nodes and edges.')}</p><p class="muted">${t('*For passende implementeringer. Pythons list.append er amortiseret O(1). Hashopslag kan i værste fald være O(n).','*With suitable implementations. Python list.append is amortised O(1). Hash lookup can be O(n) in the worst case.')}</p></section><section class="card"><h2>${t('Tal om designvalg','Discuss design choices')}</h2><p>${t('1. Du skal altid behandle den ældste opgave først. Hvilken struktur passer?','1. You must always process the oldest task first. Which structure fits?')}</p><p>${t('2. Du skal finde en student ud fra et studienummer. Hvilken struktur passer?','2. You need to find a student by student ID. Which structure fits?')}</p><p>${t('3. Du skal forbinde lokaler med gangstier. Hvilken struktur passer?','3. You need to connect rooms with walking paths. Which structure fits?')}</p><details><summary>${t('Vis mulige svar','Show possible answers')}</summary><p>1. Queue. 2. Hash Table. 3. Graph.</p></details><p class="muted" style="margin-top:16px">${t('Stack og Queue beskriver adgangsregler. De kan bygges med andre datastrukturer. Et træ er også en særlig slags graf.','Stack and Queue describe access rules. They can be built using other data structures. A tree is also a special kind of graph.')}</p></section></div>`;

function quiz(){
 $('content').innerHTML=`<div class="eyebrow">${t('Aktiv genkaldelse / 7 spørgsmål','Active recall / 7 questions')}</div><h1>${t('Kan du forudsige det næste trin?','Can you predict the next step?')}</h1><p class="intro">${t('Svar selv eller stem i klassen. Du får en forklaring på hvert svar.','Answer on your own or vote as a class. Each answer comes with an explanation.')}</p><form id="quizform"><div class="quiz-grid">${questions().map((q,i)=>`<fieldset class="question"><legend>${i+1}. ${q[0]}</legend>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''}>${a}</label>`).join('')}<div id="feedback${i}" class="feedback"></div></fieldset>`).join('')}</div><div class="controls" style="padding-left:0;border:0"><button class="primary" type="submit">${t('Tjek svar','Check answers')}</button><button type="button" id="retry">${t('Prøv igen','Try again')}</button><span id="score" role="status" aria-live="polite"></span></div></form>`;
 $('quizform').onchange=e=>{if(e.target.name){answers[Number(e.target.name.slice(1))]=Number(e.target.value);if(quizChecked)checkQuiz();}};
 $('quizform').onsubmit=e=>{e.preventDefault();quizChecked=true;checkQuiz();};
 $('retry').onclick=()=>{answers={};quizChecked=false;quiz();};if(quizChecked)checkQuiz();
}
function checkQuiz(){let score=0,done=0;questions().forEach((q,i)=>{const f=$('feedback'+i);if(answers[i]===undefined){f.textContent=t('Vælg et svar.','Choose an answer.');f.className='feedback wrong';return;}done++;const ok=answers[i]===q[2];if(ok)score++;f.className='feedback'+(ok?'':' wrong');f.textContent=(ok?t('✓ Korrekt. ','✓ Correct. '):t('Prøv at tænke igen. ','Think again. '))+q[3];});$('score').textContent=t(`${score} / 7 korrekte · ${done} / 7 besvaret`,`${score} / 7 correct · ${done} / 7 answered`);}
$('nav').onclick=e=>{const b=e.target.closest('[data-chapter]');if(b)openChapter(Number(b.dataset.chapter));};
$('previous').onclick=()=>{if(chapter>0)openChapter(chapter-1);};$('next').onclick=()=>{if(chapter<8)openChapter(chapter+1);};
$('language').onchange=e=>{language=e.target.value==='en'?'en':'da';remember('ds-language',language);rerenderPreserving();};
$('present').onclick=()=>{document.body.classList.toggle('projector');shell();};
$('help').onclick=()=>$('guide').showModal();
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('full').textContent=t('Brug browserens fuld skærm','Use the browser’s full-screen option');}};
document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?t('Afslut fuld skærm','Exit full screen'):t('Fuld skærm','Full screen');});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
openChapter(0);

</script></body></html>
